<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v106 QA · 390x844</title>
<style>
  html,body{margin:0;padding:0;background:#eef2f6;font-family:-apple-system,'Malgun Gothic',sans-serif}
  .row{display:flex;gap:14px;align-items:flex-start;padding:10px}
  .slot{background:#fff;border-radius:14px;box-shadow:0 3px 14px rgba(15,23,42,.18);overflow:hidden;flex:0 0 auto}
  iframe{border:0;display:block;width:390px;height:844px}
  #log{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;max-width:900px;color:#0f172a;
       background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(15,23,42,.12)}
</style>
</head>
<body>
<div class="row">
  <div class="slot"><iframe id="f" src="./index.html?qa106=1"></iframe></div>
  <div id="log">측정 준비 중…</div>
</div>
<script>
window.__errs = [];
var f = document.getElementById('f');
var logEl = document.getElementById('log');
function render() {
  var t = 'v106 실서버 390×844 QA\n· 콘솔 에러 ' + window.__errs.length + '건' +
    (window.__errs.length ? ':\n· ' + window.__errs.join('\n· ') : ' (0건)') + '\n' + (window.__extra || '');
  logEl.innerHTML = '<pre style="margin:0;white-space:pre-wrap">' +
    t.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
}
function hook(w) {
  try {
    w.addEventListener('error', function (e) {
      window.__errs.push('error: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      render();
    });
    w.addEventListener('unhandledrejection', function (e) {
      var r = e.reason || {};
      window.__errs.push('rejection: ' + (r.message || r));
      render();
    });
    var ce = w.console.error;
    w.console.error = function () {
      window.__errs.push('console.error: ' + Array.prototype.join.call(arguments, ' '));
      render();
      try { ce.apply(w.console, arguments); } catch (e) {}
    };
  } catch (e) { window.__errs.push('hook 실패: ' + e.message); }
}
f.addEventListener('load', function () { hook(f.contentWindow); render(); });
function probe() {
  var w = f.contentWindow, d = w.document;
  var ov = Math.max(0, d.documentElement.scrollWidth - 390);
  return {
    ver: w.TOPEDU_APP_VERSION,
    user: (w.S && w.S.cred) ? (w.S.cred.ban + ' · ' + w.S.cred.name) : null,
    ws: w.TOPEDU_WS ? { count: w.TOPEDU_WS.count, words: w.TOPEDU_WS.words, at: w.TOPEDU_WS.at, skipped: w.TOPEDU_WS.skipped } : null,
    overflowPx: ov,
    docW: d.documentElement.scrollWidth,
    errs: window.__errs.length
  };
}
window.__probe = probe;
window.__render = render;
window.__setExtra = function (t) { window.__extra = t; render(); };
render();
</script>
</body>
</html>
