<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>v104 QA · 390×844</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#f1f5f9;margin:0;padding:14px}
h1{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.box{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:14px;margin:4px 0 8px}
iframe{width:390px;height:844px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.ok{color:#059669;font-weight:800}.bad{color:#dc2626;font-weight:800}
</style></head>
<body>
<h1>v104 QA — 390×844 미리보기 · 콘솔 에러 수집</h1>
<div class="row" id="row"></div>
<script>
var pages=[['writing.html','✍️ writing'],['reading.html','📖 reading'],['pepero.html','🎡 pepero']];
var row=document.getElementById('row');
pages.forEach(function(p){
  var box=document.createElement('div');box.className='box';
  box.innerHTML='<h2>'+p[1]+' <span id="st_'+p[0]+'">불러오는 중…</span></h2>';
  var f=document.createElement('iframe');f.setAttribute('width','390');f.setAttribute('height','844');
  box.appendChild(f);row.appendChild(box);
  fetch(p[0]+'?qa='+Date.now()).then(function(r){return r.text();}).then(function(html){
    var inject='<scr'+'ipt>window.__errs=[];window.onerror=function(m,s,l,c){window.__errs.push(String(m)+" @"+l+":"+c);return false;};window.addEventListener("unhandledrejection",function(e){window.__errs.push("promise: "+((e.reason&&e.reason.message)||e.reason));});</scr'+'ipt>';
    var i=html.indexOf('<head>');
    html = i>=0 ? html.slice(0,i+6)+inject+html.slice(i+6) : inject+html;
    f.srcdoc=html;
    f.onload=function(){
      setTimeout(function(){
        var errs=[];
        try{ errs=f.contentWindow.__errs||[]; }catch(e){ errs=['(읽기 실패)'];}
        var el=document.getElementById('st_'+p[0]);
        if(el){ el.className=errs.length?'bad':'ok'; el.textContent=errs.length?('에러 '+errs.length+'건: '+errs.join(' | ')):'콘솔 에러 0건'; }
      },7000);
    };
  });
});
</script>
</body></html>
