<script>
window.QA = { errs: [], mode: '' };
(function () {
  var q = String(location.search || '');
  var m = q.match(/mode=([a-z0-9_]+)/i);
  QA.mode = m ? m[1] : 'normal';
  document.getElementById('mode').textContent = '· ' + QA.mode;
  var fr = document.getElementById('fr');
  fr.addEventListener('load', function () {
    var w = null;
    try { w = fr.contentWindow; } catch (e) { QA.errs.push('win-fail:' + e.message); return; }
    try {
      w.addEventListener('error', function (e) { QA.errs.push('error:' + (e.message || '') + '@' + (e.lineno || 0)); });
      w.addEventListener('unhandledrejection', function (e) { QA.errs.push('reject:' + ((e.reason && e.reason.message) || e.reason || '')); });
      var ce = w.console.error;
      w.console.error = function () {
        QA.errs.push('console.error:' + Array.prototype.join.call(arguments, ' '));
        if (ce) { try { ce.apply(w.console, arguments); } catch (e) {} }
      };
    } catch (e) { QA.errs.push('hook-fail:' + e.message); }

    if (QA.mode === 'offline') {
      try {
        w.TOPEDU_DB_URL = 'https://offline-sim.invalid/exec';
        w.login({ ban: '홍천고1', name: '여예진', pw: '9007' });
      } catch (e) { QA.errs.push('offline-fail:' + e.message); }
    }
  });
})();
</script>
