<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v108 QA · 390×844</title>
<style>
  html, body { margin: 0; background: #0f172a; font-family: Pretendard, sans-serif; }
  .bar { color: #e2e8f0; font-size: 12px; padding: 6px 10px; font-weight: 700; }
  .bar b { color: #5eead4; }
  iframe { border: 0; display: block; background: #fff; width: 390px; height: 844px; }
</style>
</head>
<body>
<div class="bar" id="bar">v108 반 정리 QA · <b>390×844</b> · 에러 <b id="ec">0</b>건</div>
<iframe id="fr" src="index.html?qa=108" width="390" height="844"></iframe>
<script>
var fr = document.getElementById('fr'), ec = document.getElementById('ec');
fr.addEventListener('load', function(){
  try {
    var w = fr.contentWindow; w.__topeduErrors = [];
    w.addEventListener('error', function(e){ w.__topeduErrors.push(String((e && (e.message || e.error)) || e)); ec.textContent = w.__topeduErrors.length; });
    w.addEventListener('unhandledrejection', function(e){ w.__topeduErrors.push('reject: ' + String(e && e.reason)); ec.textContent = w.__topeduErrors.length; });
  } catch(e){}
});
</script>
</body>
