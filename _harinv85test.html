<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harin v85 mobile harness</title>
<style>
  html, body { margin: 0; background: #e2e8f0; font-family: sans-serif; }
  #stage { display: flex; justify-content: center; gap: 20px; padding: 14px 0; }
  iframe { width: 390px; height: 844px; border: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
</style>
</head>
<body>
<!-- #f: 실제 그대로 (스크린샷·조작용) / #g: 오류 수집용 새 문서 -->
<div id="stage">
  <iframe id="f" src="harin.html?v=harinv85c"></iframe>
  <iframe id="g"></iframe>
</div>
<script>
window.__errs = [];
window.__gready = false;
var g = document.getElementById('g');
fetch('harin.html?v=harinv85err' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
  var shim = '<scr' + 'ipt>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push("error: "+e.message+" @"+(e.filename||"")+":"+(e.lineno||0));});window.addEventListener("unhandledrejection",function(e){window.__errs.push("rej: "+((e.reason&&e.reason.message)||e.reason));});</scr' + 'ipt>';
  t = t.replace('<head>', '<head><base href="https://smcciao-commits.github.io/-/">' + shim);
  var d = g.contentWindow.document;
  d.open(); d.write(t); d.close();
  window.__gready = true;
}).catch(function (e) { window.__errs.push('fetch: ' + e); });
</script>
</body>
</html>
