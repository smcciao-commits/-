<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA 390 임시 검증 페이지</title>
<style>
  html,body{margin:0;background:#e5e7eb}
  #f{width:390px;height:844px;border:0;display:block;background:#fff}
  #bar{position:fixed;left:396px;top:0;width:700px;height:844px;overflow:auto;background:#111;color:#7CFC98;padding:10px;box-sizing:border-box;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f" title="harin 390"></iframe>
<div id="bar">loading…</div>
<script>
var log = [];
function put(t){ log.push(t); document.getElementById('bar').textContent = log.join('\n'); }
fetch('harin.html?qa=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
  html = html.replace("navigator.serviceWorker.register('sw.js')", "Promise.resolve()");
  var hook = '<script>window.__qaErrs=[];(function(){window.addEventListener("error",function(e){try{window.__qaErrs.push("ERROR "+(e.message||e.type)+" L"+(e.lineno||""))}catch(x){}},true);window.addEventListener("unhandledrejection",function(e){try{window.__qaErrs.push("REJECT "+((e.reason&&e.reason.message)||e.reason))}catch(x){}});var ce=console.error;console.error=function(){try{window.__qaErrs.push("CONSOLE "+Array.prototype.join.call(arguments," "))}catch(x){};return ce.apply(console,arguments)};})();<\/script>';
  var dir = location.href.replace(/[^\/]*$/, '');
  html = html.replace('<head>', '<head><base href="' + dir + '">' + hook);
  var f = document.getElementById('f');
  f.onload = function(){
    try{
      var w = f.contentWindow, d = w.document;
      put('viewport ' + w.innerWidth + 'x' + w.innerHeight);
      put('title: ' + d.title);
      setTimeout(function(){
        try{
          put('ERRORS (' + w.__qaErrs.length + '):');
          w.__qaErrs.forEach(function(x){ put('  ' + x); });
          put('화 1-3: ' + w.eval("SCHEDULE['화'].slice(0,3).map(function(i){return i.time+' '+i.title}).join(' | ')"));
          put('목 1-3: ' + w.eval("SCHEDULE['목'].slice(0,3).map(function(i){return i.time+' '+i.title}).join(' | ')"));
          put('월 1-2: ' + w.eval("SCHEDULE['월'].slice(0,2).map(function(i){return i.time+' '+i.title}).join(' | ')"));
          put('수 3:   ' + w.eval("SCHEDULE['수'][2].time+' '+SCHEDULE['수'][2].title"));
          put('joyNew 화/목: ' + w.eval("joyNewTimeOn('화')+' / '+joyNewTimeOn('목')"));
          put('today: ' + d.getElementById('cur_day_label').textContent + ' / cards ' + d.querySelectorAll('#schedule_list .item-card').length);
          put('note: [' + d.getElementById('joy_note').style.display + '] ' + d.getElementById('joy_note').textContent);
          put('scrollWidth ' + d.documentElement.scrollWidth + ' (iframe 390)');
          put('overflowX: ' + (d.documentElement.scrollWidth > 390 ? 'YES' : 'no'));
          put('reward card exists: ' + !!d.getElementById('reward_passcode_card'));
          put('READY');
        }catch(e){ put('HARNESS2 ' + e.message); }
      }, 1800);
    }catch(e){ put('HARNESS ' + e.message); }
  };
  f.srcdoc = html;
}).catch(function(e){ put('FETCH ERR ' + e.message); });
</script>
</body>
</html>
