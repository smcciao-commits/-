<div class="bar" id="bar">능률VOCA 어원편 인강 QA · <b>390×844</b> · 에러 <b id="ec">0</b>건 · <span id="ver">-</span></div>
<iframe id="fr" src="index.html?qa=v114" width="390" height="844"></iframe>
<script>
var fr = document.getElementById('fr'), ec = document.getElementById('ec'), ver = document.getElementById('ver');
fr.addEventListener('load', function(){
  try {
    var w = fr.contentWindow; w.__topeduErrors = [];
    function push(m){ w.__topeduErrors.push(String(m)); ec.textContent = w.__topeduErrors.length; }
    w.addEventListener('error', function(e){ push((e && (e.message || e.error)) || e); });
    w.addEventListener('unhandledrejection', function(e){ push('reject: ' + String(e && e.reason)); });
    if (w.console && w.console.error) { var ce = w.console.error; w.console.error = function(){ push('console: ' + Array.prototype.join.call(arguments, ' ')); return ce.apply(w.console, arguments); }; }
    try { ver.textContent = w.TOPEDU_APP_VERSION || '-'; } catch(e){}
  } catch(e){}
});
</script>
