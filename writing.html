<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d9488">
<title>탑에듀 내신 서술형 · 어순배열</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
@font-face{font-family:'Maplestory';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFLight.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Maplestory';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');font-weight:700;font-display:swap}
:root{
  --bg:#f8fafc; --card:#ffffff; --ink:#1e293b; --sub:#64748b;
  --line:#ccfbf1; --rule:#f0fdfa; --pri:#0d9488; --pri2:#f0fdfa; --pri3:#0f766e;
  --ok:#16a34a; --okbg:#dcfce7; --no:#dc2626; --nobg:#fee2e2;
  --warn:#d97706; --warnbg:#fef3c7;
  --shadow:0 4px 14px rgba(13,148,136,.08),0 1px 3px rgba(0,0,0,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100vh;background-color:#f8fafc;
 background-image:
  radial-gradient(at 12% 12%,rgba(153,246,228,.45) 0px,transparent 48%),
  radial-gradient(at 88% 10%,rgba(221,214,254,.42) 0px,transparent 48%),
  radial-gradient(at 85% 88%,rgba(254,240,138,.38) 0px,transparent 48%),
  radial-gradient(at 15% 88%,rgba(254,205,211,.35) 0px,transparent 48%),
  radial-gradient(at 50% 48%,rgba(186,230,253,.32) 0px,transparent 52%);
 background-attachment:fixed;color:var(--ink);
 font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 font-size:17px;line-height:1.5;overflow-x:hidden}
.wrap{max-width:580px;margin:0 auto;padding:14px 16px 48px}
h1{font-family:'Maplestory',Pretendard,sans-serif;font-size:23px;font-weight:700;margin:6px 0 2px}
h2{font-family:'Maplestory',Pretendard,sans-serif;font-size:19px;font-weight:700;color:var(--pri);margin:0 0 10px}
.sub{color:var(--sub);font-size:13.5px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;transition:transform .12s ease,opacity .12s ease,background .15s ease}
button:active{transform:scale(.98)}
.btn{display:block;width:100%;padding:15px;background:linear-gradient(135deg,#0d9488,#14b8a6);color:#fff;
 font-family:'Maplestory',Pretendard,sans-serif;font-weight:700;font-size:17px;margin-top:10px;
 box-shadow:0 4px 14px rgba(13,148,136,.22)}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.gray{background:var(--pri2);color:var(--pri3);box-shadow:none}
.btn:disabled{opacity:.45;transform:none;cursor:default}
.label{display:block;font-size:13px;font-weight:700;color:var(--pri3);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.err{color:var(--no);font-size:13.5px;font-weight:700;margin-top:8px;min-height:18px}
.linkbtn{display:block;width:100%;background:none;color:var(--sub);font-size:13.5px;font-weight:700;padding:12px;text-decoration:underline}
.top{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.grow{flex:1;min-width:0}
.title{font-family:'Maplestory',Pretendard,sans-serif;font-size:20px;font-weight:700;line-height:1.3}
.ver{font-size:11px;font-weight:700;color:#0d9488;background:#ccfbf1;border-radius:999px;padding:2px 8px;vertical-align:middle;font-family:Pretendard,sans-serif}
.refresh{background:#fff;border:1.5px solid var(--line);color:var(--pri3);font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:12px;white-space:nowrap}
.back{background:#fff;border:1.5px solid var(--line);color:var(--sub);font-size:13px;font-weight:700;padding:7px 10px;border-radius:12px;white-space:nowrap}
.chip{display:inline-block;background:var(--pri2);color:var(--pri3);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:0 4px 4px 0}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.no{background:var(--nobg);color:var(--no)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.modebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:8px}
.modebtn .num{font-family:'Maplestory',sans-serif;font-size:18px;color:var(--pri);flex:0 0 auto}
.modebtn .mt{flex:1;min-width:0}
.modebtn .mn{display:block;font-weight:700;font-size:16px;color:var(--ink);line-height:1.3}
.modebtn .md{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.35}
.modebtn .ms{font-size:12px;font-weight:700;color:var(--pri3);white-space:nowrap;text-align:right;flex:0 0 auto}
.progbar{height:8px;background:var(--rule);border-radius:999px;overflow:hidden;margin:8px 0 12px}
.progbar>i{display:block;height:100%;background:linear-gradient(90deg,#0d9488,#2dd4bf);border-radius:999px;transition:width .25s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qno{font-family:'Maplestory',sans-serif;font-size:15px;font-weight:700;color:var(--pri3)}
.ko{font-size:18.5px;font-weight:700;line-height:1.5;margin:10px 0 8px;word-break:keep-all}
.cond{background:var(--pri2);border:1px dashed #99f6e4;border-radius:12px;padding:9px 12px;font-size:13.5px;color:#115e59;font-weight:700;line-height:1.45}
.hintchip{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--pri3);margin-top:8px}
.ansslot{min-height:60px;border:1.5px dashed #99f6e4;border-radius:14px;background:#f8fffe;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-top:10px}
.ansslot .ph{color:#94a3b8;font-size:13.5px;padding:8px 4px}
.sel{background:var(--pri);color:#fff;border-radius:11px;padding:8px 12px;font-size:15.5px;font-weight:700;min-height:38px}
.sel .o{font-size:10.5px;opacity:.8;margin-right:3px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.word{background:#fff;border:1.5px solid #99f6e4;color:#0f766e;font-size:16px;font-weight:700;padding:10px 14px;border-radius:12px;min-height:44px;box-shadow:0 1px 2px rgba(13,148,136,.08)}
.word:active{background:var(--pri2)}
.sentline{font-size:18px;line-height:2.1;margin-top:12px}
.sentline input{width:auto;min-width:110px;max-width:60%;padding:6px 8px;border:0;border-bottom:2px solid var(--pri);border-radius:0;background:#f0fdfa;font-size:17px;font-weight:700;color:var(--pri3);text-align:center}
.writing{min-height:92px;resize:vertical;font-size:16.5px;line-height:1.6}
.fb{margin-top:12px;border-radius:16px;padding:13px;border:1.5px solid}
.fb.ok{background:#f0fdf4;border-color:#86efac}
.fb.no{background:#fff1f2;border-color:#fecdd3}
.fbhead{font-family:'Maplestory',sans-serif;font-size:16px;font-weight:700;margin-bottom:8px}
.fb.ok .fbhead{color:var(--ok)}
.fb.no .fbhead{color:var(--no)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.cmp .lbl{font-size:11.5px;font-weight:700;color:var(--sub)}
.cmp .val{font-size:14.5px;font-weight:700;margin-top:3px;word-break:break-word;line-height:1.45}
.cmp .col.mine .val{color:#b91c1c}
.cmp .col.best .val{color:#0f766e}
.exp{margin-top:10px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px}
.exp b{font-size:13px;color:var(--pri3)}
.exp p{margin:4px 0 0;font-size:14px;line-height:1.6;color:#334155;word-break:keep-all}
.score{text-align:center;padding:6px 0 2px}
.score .num{font-family:'Maplestory',sans-serif;font-size:52px;font-weight:700;color:var(--pri);line-height:1.1}
.score .lbl{font-size:13.5px;color:var(--sub);font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
.row>.btn{margin-top:0;flex:1}
.wrongitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff}
.wrongitem .wk{font-size:15px;font-weight:700;word-break:keep-all}
.wrongitem .wa{font-size:13px;color:var(--sub);margin-top:4px;word-break:break-word}
.wrongitem .wa b{color:var(--pri3)}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px;background:#fff}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--pri3)}
details p{margin:6px 0 0;font-size:13.5px;color:#334155;line-height:1.6}
.tsec{font-family:'Maplestory',sans-serif;font-size:15px;font-weight:700;color:var(--pri3);margin:16px 0 4px}
.titem{border-bottom:1px dashed var(--line);padding:10px 0}
.titem:last-child{border-bottom:0}
.titem .tko{font-size:15px;font-weight:700;word-break:keep-all}
.titem .tmeta{font-size:12px;color:var(--sub);margin-top:3px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:99999;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.load{display:none}

/* ===== 인쇄 / 미리보기 ===== */
#printRoot{display:none}
#printRoot.preview{display:block;position:fixed;inset:0;overflow:auto;background:#e2e8f0;z-index:60;padding:14px 8px 72px}
.p-bar{position:sticky;top:0;max-width:820px;margin:0 auto 10px;background:#0f172a;color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700}
.p-bar .sp{flex:1}
.p-bar button{padding:9px 13px;border-radius:10px;font-size:13px;font-weight:700;background:#14b8a6;color:#04211d}
.p-bar button.g{background:#fff;color:#0f172a}
.p-page{background:#fff;width:100%;max-width:820px;margin:0 auto 14px;padding:26px 24px;box-shadow:0 2px 10px rgba(0,0,0,.12);color:#111}
.p-head{border-bottom:2.5px solid #0f172a;padding-bottom:10px;margin-bottom:16px}
.p-title{font-family:'Maplestory',sans-serif;font-size:21px;font-weight:700;text-align:center;letter-spacing:-.3px}
.p-sub{font-size:12.5px;text-align:center;color:#334155;margin-top:4px}
.p-name{font-size:12.5px;margin-top:10px;display:flex;justify-content:space-between;gap:8px;color:#0f172a;font-weight:700}
.p-sec{font-size:13px;font-weight:700;background:#f0fdfa;border:1px solid #99f6e4;border-radius:6px;padding:5px 8px;margin:14px 0 8px;color:#115e59}
.p-q{display:flex;gap:8px;padding:9px 0;border-bottom:1px dotted #cbd5e1;break-inside:avoid;page-break-inside:avoid}
.p-num{flex:0 0 22px;font-size:13px;font-weight:700;color:#0f766e}
.p-body{flex:1;min-width:0}
.p-ko{font-size:13.5px;font-weight:700;line-height:1.45;word-break:keep-all}
.p-cond{font-size:11.5px;color:#115e59;margin-top:2px}
.p-line{border-bottom:1px solid #cbd5e1;height:22px;margin-top:3px}
.p-ans{font-size:13px;font-weight:700;color:#0f766e;line-height:1.5}
.p-ans .ex{font-size:11.5px;font-weight:400;color:#334155;margin-top:2px;line-height:1.55}
.p-note{font-size:11px;color:#64748b;margin-top:10px;text-align:center}
.p-foot{font-size:10.5px;color:#94a3b8;text-align:right;margin-top:6px}
@media print{
  html,body{background:#fff !important}
  .wrap{display:none !important}
  #printRoot,#printRoot.preview{display:block !important;position:static !important;background:#fff !important;padding:0 !important;overflow:visible !important}
  .p-bar{display:none !important}
  .p-page{box-shadow:none !important;max-width:none !important;width:auto !important;margin:0 !important;padding:0 !important;page-break-after:always}
  .p-page:last-child{page-break-after:auto}
  @page{size:A4 portrait;margin:14mm}
}
@media (max-width:380px){
  .ko{font-size:17.5px}
  .cmp{grid-template-columns:1fr}
  .p-page{padding:18px 14px}
}
</style>

t": ["wanted"], "expl": "I've는 I have의 축약형이므로 뒤에 과거분사 wanted가 와야 합니다. always는 have와 과거분사 사이에 들어갑니다."}, {"id": "s2-10", "ko": "우리는 방금 6천만 년 전의 밀림에 도착했습니다.", "en": "We've just arrived in the jungle of 60 million years ago.", "condition": "[조건] 현재완료(완료) + just / 11단어", "tag": "8과 · 현재완료", "blank": "We've just ____ (arrive) in the jungle of 60 million years ago.", "hint": "arrive", "answer": "arrived", "accept": ["arrived"], "expl": "just는 현재완료와 함께 '방금 ~했다'를 나타냅니다. have + 과거분사 형태이므로 arrived입니다."}, {"id": "s2-11", "ko": "저는 이렇게 거대한 것을 본 적이 없어요.", "en": "I've never seen such a huge thing.", "condition": "[조건] have never + p.p. (경험) / 7단어", "tag": "8과 · 현재완료(경험)", "blank": "I've never ____ (see) such a huge thing.", "hint": "see", "answer": "seen", "accept": ["seen"], "expl": "never와 함께 '경험'을 나타내는 현재완료입니다. see의 과거분사 seen을 씁니다."}, {"id": "s2-12", "ko": "어떤 때라도 그 길을 벗어나서는 안 됩니다.", "en": "You must not leave it at any time.", "condition": "[조건] must not + 동사원형 (금지) / 8단어", "tag": "8과 · 조동사(must not)", "blank": "You must not ____ (leave) it at any time.", "hint": "leave", "answer": "leave", "accept": ["leave"], "expl": "must not은 '~해서는 안 된다'라는 금지입니다. 조동사 뒤에는 동사원형 leave가 옵니다."}, {"id": "s2-13", "ko": "어떤 것도 만지지 마세요. 실수로 무언가를 죽일 수도 있습니다.", "en": "Do not touch anything. You might kill something by accident.", "condition": "[조건] 조동사 might + 동사원형 / 10단어", "tag": "8과 · 조동사(might)", "blank": "Do not touch anything. You ____ kill something by accident.", "hint": "may", "answer": "might", "accept": ["might"], "expl": "might는 may의 과거형이지만 여기서는 '~할 수도 있다'라는 낮은 가능성을 나타냅니다. 뒤에는 동사원형 kill이 옵니다."}, {"id": "s2-14", "ko": "그는 너무 공포에 질려서 실수로 길을 벗어났다.", "en": "He was so terrified that he left the path by accident.", "condition": "[조건] so + 형용사 + that 절 / 11단어", "tag": "8과 · so~that", "blank": "He was so ____ (terrify) that he left the path by accident.", "hint": "terrify", "answer": "terrified", "accept": ["terrified"], "expl": "so + 형용사 + that은 '너무 ~해서 …하다'입니다. 공포를 느끼는 사람이 주어이므로 -ed형 terrified를 씁니다."}, {"id": "s2-15", "ko": "안전을 지키기 위해, 당신은 그의 지시를 따라야만 합니다.", "en": "To stay safe, you must follow his instructions.", "condition": "[조건] To부정사 목적 + must / 8단어", "tag": "8과 · to부정사(목적)", "blank": "____ (stay) safe, you must follow his instructions.", "hint": "stay", "answer": "To stay", "accept": ["To stay", "to stay"], "expl": "문장 앞의 To stay safe는 '안전을 지키기 위해'라는 목적을 나타냅니다. 주절에는 must + 동사원형이 옵니다."}, {"id": "s2-16", "ko": "당신이 어떤 바보 같은 짓도 하지 않기를 바랍니다.", "en": "I don't want you to do anything foolish.", "condition": "[조건] want + 목적어 + to부정사 / 8단어", "tag": "8과 · to부정사(목적격보어)", "blank": "I don't want you ____ (do) anything foolish.", "hint": "do", "answer": "to do", "accept": ["to do"], "expl": "want는 want + 목적어 + to부정사 형태로 '~가 …하기를 원하다'를 만듭니다. you 다음에 to do가 와야 합니다."}, {"id": "s2-17", "ko": "밀림은 안개로 뒤덮여 있었다.", "en": "The jungle was covered in fog.", "condition": "[조건] be covered in + 명사 / 6단어", "tag": "8과 · 수동태", "blank": "The jungle was ____ (cover) in fog.", "hint": "cover", "answer": "covered", "accept": ["covered"], "expl": "be covered in ~은 '~로 덮여 있다'라는 수동의 상태 표현입니다. cover의 과거분사 covered를 씁니다."}, {"id": "s2-18", "ko": "그것은 큰 포효와 함께 그들을 향해 갑자기 뛰기 시작했다.", "en": "It suddenly started to run toward them with a loud roar.", "condition": "[조건] start + to부정사 / 11단어", "tag": "8과 · to부정사(목적어)", "blank": "It suddenly started ____ (run) toward them with a loud roar.", "hint": "run", "answer": "to run", "accept": ["to run", "running"], "expl": "start 뒤에는 to부정사와 동명사가 모두 올 수 있습니다. 여기서는 to run으로 쓰면 자연스럽습니다."}, {"id": "s2-19", "ko": "축제는 음악, 음식, 즐거움으로 가득 찬 특별한 날 그 이상이다.", "en": "Festivals are more than special days filled with music, food, and fun.", "condition": "[조건] 명사를 수식하는 과거분사 / 12단어", "tag": "7과 외부1 · 분사(수식)", "blank": "Festivals are more than special days ____ (fill) with music, food, and fun.", "hint": "fill", "answer": "filled", "accept": ["filled"], "expl": "special days를 뒤에서 꾸미는 분사구로, '가득 찬'이라는 수동의 의미이므로 과거분사 filled를 씁니다."}, {"id": "s2-20", "ko": "가족들은 식사를 나누고 자신들이 가진 것에 감사를 표현하기 위해 모인다.", "en": "Families gather to share a meal and express gratitude for what they have.", "condition": "[조건] 전치사 for + 관계대명사 what / 13단어", "tag": "7과 외부1 · 관계대명사 what", "blank": "Families gather to share a meal and express gratitude for ____ they have.", "hint": "what", "answer": "what", "accept": ["what"], "expl": "전치사 for 뒤에 '가지고 있는 것'이라는 명사절이 필요하므로 선행사를 포함하는 what을 씁니다. that은 전치사 뒤에 쓰지 않습니다."}, {"id": "s2-21", "ko": "둘 다 사람들이 축하 행사를 통해 자신들의 감정과 가치를 어떻게 표현하는지 보여준다.", "en": "Both show how people express their feelings and values through celebrations.", "condition": "[조건] 간접의문문 how / 11단어", "tag": "7과 외부1 · 간접의문문", "blank": "Both show ____ people express their feelings and values through celebrations.", "hint": "how", "answer": "how", "accept": ["how"], "expl": "show의 목적어로 '어떻게 ~하는지'라는 간접의문문이 왔습니다. 간접의문문은 의문사 + 주어 + 동사 어순입니다."}, {"id": "s2-22", "ko": "이러한 방식으로, 축제는 문화가 한 세대에서 다음 세대로 전해지도록 돕는다.", "en": "In this way, festivals help pass culture from one generation to the next.", "condition": "[조건] help + 동사원형 / 13단어", "tag": "7과 외부1 · help + 동사원형", "blank": "In this way, festivals help ____ (pass) culture from one generation to the next.", "hint": "pass", "answer": "pass", "accept": ["pass", "to pass"], "expl": "help 뒤에는 동사원형이 오고, to를 넣어 help to pass로 써도 됩니다. '문화가 전해지도록 돕는다'입니다."}, {"id": "s2-23", "ko": "기억은 우리로 하여금 과거의 경험들을 회상할 수 있게 한다.", "en": "Memory enables us to recollect past experiences.", "condition": "[조건] enable + 목적어 + to부정사 / 7단어", "tag": "7과 외부2 · to부정사(목적격보어)", "blank": "Memory enables us ____ (recollect) past experiences.", "hint": "recollect", "answer": "to recollect", "accept": ["to recollect"], "expl": "enable은 '~가 …하게 하다'라는 뜻으로 enable + 목적어 + to부정사 형태를 씁니다. 회상하는 주체는 us입니다."}, {"id": "s2-24", "ko": "그것은 글, 그림, 기념비, 의식, 그리고 다른 상징들을 통해 전해진다.", "en": "It is passed through text, paintings, monuments, rites, and other symbols.", "condition": "[조건] 수동태 be + p.p. / 11단어", "tag": "7과 외부2 · 수동태", "blank": "It is ____ (pass) through text, paintings, monuments, rites, and other symbols.", "hint": "pass", "answer": "passed", "accept": ["passed"], "expl": "문화적 기억은 전달되는 대상이므로 수동태 is passed입니다. through는 '~을 통해'라는 수단을 나타냅니다."}], "pre1": [{"id": "p1-01", "ko": "그는 피곤해서 일찍 잤다.", "en": "Being tired, he went to bed early.", "condition": "[조건] 분사구문(Being)을 사용해 영작 / 7단어", "tag": "분사구문", "blank": "____ (be) tired, he went to bed early.", "hint": "be", "answer": "Being", "accept": ["Being", "being"], "expl": "접속사와 주어를 지우고 동사를 -ing로 바꾼 분사구문입니다. 원래 Because he was tired에서 be동사가 being으로 남아 Being tired,가 됩니다."}, {"id": "p1-02", "ko": "그는 영어를 몰라서 그 질문을 이해하지 못했다.", "en": "Not knowing English, he couldn't understand the question.", "condition": "[조건] 부정 분사구문 / 8단어", "tag": "분사구문(부정)", "blank": "____ knowing English, he couldn't understand the question.", "hint": "not", "answer": "Not", "accept": ["Not", "not"], "expl": "분사구문을 부정할 때는 Not을 분사 앞에 둡니다. Knowing not English처럼 쓰지 않고 Not knowing English로 씁니다."}, {"id": "p1-03", "ko": "그 소식을 듣고 나서, 그는 집으로 돌아갔다.", "en": "Having heard the news, he returned home.", "condition": "[조건] 완료 분사구문(Having p.p.) / 7단어", "tag": "분사구문(완료)", "blank": "____ heard the news, he returned home.", "hint": "have", "answer": "Having", "accept": ["Having", "having"], "expl": "주절보다 먼저 일어난 일을 나타낼 때는 Having + p.p.를 씁니다. '듣고 나서 → 돌아갔다'의 시간 차이가 드러납니다."}, {"id": "p1-04", "ko": "그가 한 말은 모두를 놀라게 했다.", "en": "What he said surprised everyone.", "condition": "[조건] 관계대명사 what을 주어로 / 5단어", "tag": "관계대명사 what", "blank": "____ he said surprised everyone.", "hint": "what", "answer": "What", "accept": ["What", "what"], "expl": "what은 the thing that의 뜻으로, 선행사를 포함합니다. What he said를 주어로 쓰면 '그가 한 말'이라는 명사절이 됩니다."}, {"id": "p1-05", "ko": "이것이 내가 원하는 것이다.", "en": "This is what I want.", "condition": "[조건] what = the thing that / 5단어", "tag": "관계대명사 what", "blank": "This is ____ I want.", "hint": "what", "answer": "what", "accept": ["what"], "expl": "보어 자리에 what I want를 넣어 '내가 원하는 것'을 만듭니다. that I want라고 하면 선행사가 없어 문장이 어색해집니다."}, {"id": "p1-06", "ko": "그녀는 시험에 합격했는데, 그것은 우리 모두를 기쁘게 했다.", "en": "She passed the exam, which made all of us happy.", "condition": "[조건] 계속적 용법의 which / 10단어", "tag": "계속적 용법(which)", "blank": "She passed the exam, ____ made all of us happy.", "hint": "which", "answer": "which", "accept": ["which"], "expl": "계속적 용법의 which는 앞 문장 전체를 선행사로 받습니다. '그것은(시험에 합격한 일은) 우리를 기쁘게 했다'로 해석합니다."}, {"id": "p1-07", "ko": "나는 토니를 만났는데, 그는 나를 도와주었다.", "en": "I met Tony, who helped me.", "condition": "[조건] 계속적 용법의 who / 6단어", "tag": "계속적 용법(who)", "blank": "I met Tony, ____ helped me.", "hint": "who", "answer": "who", "accept": ["who"], "expl": "쉼표 뒤의 계속적 용법 who는 '그리고 그는'처럼 문장을 이어 줍니다. 삽입절이므로 직역이 아니라 자연스럽게 해석합니다."}, {"id": "p1-08", "ko": "내가 너라면 그렇게 하지 않을 것이다.", "en": "If I were you, I would not do that.", "condition": "[조건] 가정법 과거 / 9단어", "tag": "가정법 과거", "blank": "If I ____ (be) you, I would not do that.", "hint": "be", "answer": "were", "accept": ["were"], "expl": "가정법 과거에서 be동사는 주어와 상관없이 were를 씁니다. 주절에는 would + 동사원형이 옵니다."}, {"id": "p1-09", "ko": "내가 더 열심히 공부했더라면, 시험에 합격했을 것이다.", "en": "If I had studied harder, I would have passed the exam.", "condition": "[조건] 가정법 과거완료 / 11단어", "tag": "가정법 과거완료", "blank": "If I had ____ (study) harder, I would have passed the exam.", "hint": "study", "answer": "studied", "accept": ["studied"], "expl": "과거 사실의 반대는 If + had p.p., would have p.p.로 씁니다. had 뒤에는 과거분사 studied가 필요합니다."}, {"id": "p1-10", "ko": "나는 그가 여기 있으면 좋겠다.", "en": "I wish he were here.", "condition": "[조건] I wish + 가정법 과거 / 5단어", "tag": "I wish 가정법", "blank": "I wish he ____ (be) here.", "hint": "be", "answer": "were", "accept": ["were"], "expl": "I wish + 과거형은 '지금 ~라면 좋겠다'는 뜻입니다. be동사는 were를 쓰고, 해석은 현재 상황의 반대입니다."}, {"id": "p1-11", "ko": "영어는 전 세계에서 말해진다.", "en": "English is spoken all over the world.", "condition": "[조건] 현재시제 수동태 / 7단어", "tag": "수동태", "blank": "English is ____ (speak) all over the world.", "hint": "speak", "answer": "spoken", "accept": ["spoken"], "expl": "수동태는 be동사 + 과거분사입니다. speak의 과거분사는 spoken이며, 지금의 일반적인 사실이므로 is를 씁니다."}, {"id": "p1-12", "ko": "그 다리는 1990년에 지어졌다.", "en": "The bridge was built in 1990.", "condition": "[조건] 과거시제 수동태 / 6단어", "tag": "수동태(과거)", "blank": "The bridge was ____ (build) in 1990.", "hint": "build", "answer": "built", "accept": ["built"], "expl": "1990년이라는 과거 시점이므로 be동사를 was로 쓰고, build의 과거분사 built를 붙입니다."}, {"id": "p1-13", "ko": "그 문제는 곧 해결될 것이다.", "en": "The problem will be solved soon.", "condition": "[조건] 조동사 + be p.p. / 6단어", "tag": "수동태(조동사)", "blank": "The problem will be ____ (solve) soon.", "hint": "solve", "answer": "solved", "accept": ["solved"], "expl": "조동사가 있는 수동태는 will be + 과거분사 형태입니다. be를 빠뜨리면 will solved가 되어 틀립니다."}, {"id": "p1-14", "ko": "그는 그 책을 받았다.", "en": "He was given the book.", "condition": "[조건] 4형식의 수동태 / 5단어", "tag": "수동태(4형식)", "blank": "He was ____ (give) the book.", "hint": "give", "answer": "given", "accept": ["given"], "expl": "4형식 문장을 수동태로 바꿀 때 간접목적어를 주어로 세우면 'be given + 직접목적어'가 됩니다. give의 과거분사는 given입니다."}, {"id": "p1-15", "ko": "새 학교가 지어지고 있다.", "en": "A new school is being built.", "condition": "[조건] 진행형 수동태 / 6단어", "tag": "수동태(진행)", "blank": "A new school is ____ (build).", "hint": "build", "answer": "being built", "accept": ["being built"], "expl": "진행형 수동태는 be + being + p.p.입니다. '지어지고 있는 중'이므로 is being built가 됩니다."}, {"id": "p1-16", "ko": "날씨가 좋아서, 우리는 산책을 나갔다.", "en": "The weather being fine, we went out for a walk.", "condition": "[조건] 독립분사구문 / 10단어", "tag": "독립분사구문", "blank": "The weather ____ (be) fine, we went out for a walk.", "hint": "be", "answer": "being", "accept": ["being"], "expl": "분사구문의 주어가 주절의 주어(we)와 다르면 그 주어를 그대로 남깁니다. 이것이 독립분사구문이며 be동사는 being이 됩니다."}, {"id": "p1-17", "ko": "그는 마치 왕인 것처럼 행동한다.", "en": "He acts as if he were a king.", "condition": "[조건] as if + 가정법 과거 / 8단어", "tag": "as if 가정법", "blank": "He acts as if he ____ (be) a king.", "hint": "be", "answer": "were", "accept": ["were"], "expl": "as if 뒤에 사실과 다른 가정을 나타낼 때 가정법 과거를 쓰며 be동사는 were입니다. '실제로 왕은 아니지만'이라는 뜻이 담깁니다."}, {"id": "p1-18", "ko": "이 책은 언제 쓰였니?", "en": "When was this book written?", "condition": "[조건] 수동태 의문문 / 5단어", "tag": "수동태(의문문)", "blank": "When was this book ____ (write)?", "hint": "write", "answer": "written", "accept": ["written"], "expl": "의문사가 있는 수동태 의문문은 의문사 + be동사 + 주어 + p.p. 순서입니다. write의 과거분사는 written입니다."}], "hong1": [{"id": "h1-01", "ko": "그가 그 문제를 혼자 해결하는 것은 불가능하다.", "en": "It is impossible for him to solve the problem alone.", "condition": "[조건] 가주어 It + for + 목적격 + to부정사 / 10단어", "tag": "가주어·진주어", "blank": "It is impossible for him ____ (solve) the problem alone.", "hint": "solve", "answer": "to solve", "accept": ["to solve"], "expl": "It은 가주어, to solve 이하는 진주어입니다. 의미상 주어 앞에는 for를 쓰고, to부정사는 동사원형으로 시작합니다."}, {"id": "h1-02", "ko": "그렇게 말해 주다니 너는 참 친절했구나.", "en": "It was kind of you to say so.", "condition": "[조건] 가주어 It + of + 사람 + to부정사 / 8단어", "tag": "가주어(of)", "blank": "It was kind ____ you to say so.", "hint": "of", "answer": "of", "accept": ["of"], "expl": "kind, nice, foolish처럼 사람의 성품을 나타내는 형용사 뒤에는 for가 아니라 of를 씁니다. 'you are kind'가 성립하기 때문입니다."}, {"id": "h1-03", "ko": "그가 거짓말을 했다는 것은 분명하다.", "en": "It is clear that he lied.", "condition": "[조건] 가주어 It + that절 / 6단어", "tag": "가주어·that절", "blank": "It is clear ____ he lied.", "hint": "that", "answer": "that", "accept": ["that"], "expl": "It을 가주어로 두고 진주어인 that절을 뒤로 보냈습니다. 이때 that은 생략하지 않고 쓰는 것이 원칙입니다."}, {"id": "h1-04", "ko": "나는 그런 아름다운 풍경을 본 적이 없다.", "en": "Never have I seen such a beautiful view.", "condition": "[조건] 부정어 도치 / 8단어", "tag": "도치(부정어)", "blank": "Never ____ I seen such a beautiful view.", "hint": "have", "answer": "have", "accept": ["have"], "expl": "Never, Hardly 같은 부정어가 문장 앞에 오면 조동사가 주어 앞으로 나갑니다. Never have I seen ~의 어순입니다."}, {"id": "h1-05", "ko": "언덕 위에 오래된 성이 서 있다.", "en": "On the hill stands an old castle.", "condition": "[조건] 장소 부사구 도치 / 7단어", "tag": "도치(장소)", "blank": "On the hill ____ (stand) an old castle.", "hint": "stand", "answer": "stands", "accept": ["stands"], "expl": "장소 부사구가 앞에 오면 동사가 주어보다 먼저 나옵니다. 진주어 an old castle가 단수이므로 stands로 수를 맞춥니다."}, {"id": "h1-06", "ko": "그제야 나는 진실을 알았다.", "en": "Only then did I realize the truth.", "condition": "[조건] Only + 부사구 도치 / 7단어", "tag": "도치(only)", "blank": "Only then ____ I realize the truth.", "hint": "do", "answer": "did", "accept": ["did"], "expl": "Only + 부사구가 문장 앞에 오면 뒤에서 조동사 도치가 일어납니다. 과거 문장이므로 did + 주어 + 동사원형입니다."}, {"id": "h1-07", "ko": "누구든지 그 규칙을 어기는 사람은 벌을 받는다.", "en": "Whoever breaks the rule will be punished.", "condition": "[조건] 복합관계대명사 whoever / 7단어", "tag": "복합관계사(whoever)", "blank": "____ breaks the rule will be punished.", "hint": "whoever", "answer": "Whoever", "accept": ["Whoever", "whoever"], "expl": "whoever는 '누구든지 ~하는 사람'이라는 뜻으로 주어 역할을 합니다. 뒤에 동사 breaks가 바로 이어집니다."}, {"id": "h1-08", "ko": "네가 무엇을 선택하든지 나는 너를 지지할 것이다.", "en": "Whatever you choose, I will support you.", "condition": "[조건] 복합관계대명사 whatever / 7단어", "tag": "복합관계사(whatever)", "blank": "____ you choose, I will support you.", "hint": "whatever", "answer": "Whatever", "accept": ["Whatever", "whatever"], "expl": "whatever는 '무엇을 ~하든지'라는 양보의 뜻을 담습니다. Whatever + 주어 + 동사 형태로 문장 앞에 옵니다."}, {"id": "h1-09", "ko": "그는 올 때마다 선물을 가져온다.", "en": "Whenever he comes, he brings a gift.", "condition": "[조건] 복합관계부사 whenever / 7단어", "tag": "복합관계사(whenever)", "blank": "____ he comes, he brings a gift.", "hint": "whenever", "answer": "Whenever", "accept": ["Whenever", "whenever"], "expl": "whenever는 '~할 때마다'라는 뜻의 복합관계부사입니다. 뒤에 주어와 동사가 이어지고, 주절에는 습관의 현재시제를 씁니다."}, {"id": "h1-10", "ko": "그가 어제 도서관에서 읽은 것은 바로 그 책이었다.", "en": "It was the book that he read in the library yesterday.", "condition": "[조건] It ~ that 강조구문 / 11단어", "tag": "강조구문(it~that)", "blank": "It was the book ____ he read in the library yesterday.", "hint": "that", "answer": "that", "accept": ["that"], "expl": "It is/was + 강조하는 말 + that ~ 형태로 강조구문을 만듭니다. 강조하는 말이 사물이므로 that을 씁니다."}, {"id": "h1-11", "ko": "어제 나를 도와준 사람은 바로 그녀였다.", "en": "It was she who helped me yesterday.", "condition": "[조건] 사람을 강조하는 It ~ who / 7단어", "tag": "강조구문(사람)", "blank": "It was she ____ helped me yesterday.", "hint": "who", "answer": "who", "accept": ["who", "that"], "expl": "강조하는 말이 사람일 때는 who(또는 that)를 씁니다. 격은 주격이므로 she를 씁니다.", "enAlt": ["It was she that helped me yesterday."]}, {"id": "h1-12", "ko": "그 책을 읽고 나서, 그는 편지를 썼다.", "en": "Having read the book, he wrote a letter.", "condition": "[조건] 완료 분사구문 / 8단어", "tag": "분사구문(완료)", "blank": "____ read the book, he wrote a letter.", "hint": "have", "answer": "Having", "accept": ["Having", "having"], "expl": "먼저 일어난 일(읽기)을 나타내므로 Having + p.p.를 씁니다. 단순 분사구문 Reading the book과 시간 관계가 다릅니다."}, {"id": "h1-13", "ko": "그는 팔짱을 낀 채 서 있었다.", "en": "He stood there with his arms folded.", "condition": "[조건] with + 목적어 + 분사 / 7단어", "tag": "분사구문(with)", "blank": "He stood there with his arms ____ (fold).", "hint": "fold", "answer": "folded", "accept": ["folded"], "expl": "with + 목적어 + 과거분사는 '~한 상태로'라는 부대상황을 나타냅니다. 팔은 접히는 대상이므로 수동의 의미인 folded를 씁니다."}, {"id": "h1-14", "ko": "내가 진실을 알았더라면 너에게 말했을 것이다.", "en": "Had I known the truth, I would have told you.", "condition": "[조건] if를 생략한 가정법 과거완료 도치 / 10단어", "tag": "도치(가정법)", "blank": "____ I known the truth, I would have told you.", "hint": "have", "answer": "Had", "accept": ["Had", "had"], "expl": "가정법에서 if를 생략하면 had가 주어 앞으로 나갑니다. Had I known = If I had known과 같은 뜻입니다."}, {"id": "h1-15", "ko": "어느 쪽 길을 택하든지, 그것은 긴 여정이다.", "en": "Whichever way you take, it is a long journey.", "condition": "[조건] 복합관계형용사 whichever / 9단어", "tag": "복합관계사(whichever)", "blank": "____ way you take, it is a long journey.", "hint": "whichever", "answer": "Whichever", "accept": ["Whichever", "whichever"], "expl": "whichever는 명사 way 앞에서 '어느 ~든지'라는 뜻을 더하는 복합관계형용사입니다. 뒤에 명사가 온다는 점이 whoever와 다릅니다."}, {"id": "h1-16", "ko": "그와 논쟁하는 것은 소용없다.", "en": "It is no use arguing with him.", "condition": "[조건] It is no use + 동명사 / 7단어", "tag": "가주어(no use ~ing)", "blank": "It is no use ____ (argue) with him.", "hint": "argue", "answer": "arguing", "accept": ["arguing"], "expl": "It is no use ~ing는 '~해도 소용없다'라는 관용 표현입니다. 이때 to부정사가 아니라 동명사를 씁니다."}, {"id": "h1-17", "ko": "그녀는 정말로 가고 싶어 한다.", "en": "She does want to go.", "condition": "[조건] 조동사 do로 동사 강조 / 5단어", "tag": "강조(do)", "blank": "She ____ (do) want to go.", "hint": "do", "answer": "does", "accept": ["does"], "expl": "동사를 강조할 때는 do/does/did + 동사원형을 씁니다. 주어가 3인칭 단수이므로 does를 쓰고 want는 원형 그대로 둡니다."}, {"id": "h1-18", "ko": "나는 축구를 좋아하고 내 동생도 그렇다.", "en": "I like soccer, and so does my brother.", "condition": "[조건] so + 조동사 + 주어 도치 / 8단어", "tag": "도치(so)", "blank": "I like soccer, and so ____ my brother.", "hint": "do", "answer": "does", "accept": ["does"], "expl": "'~도 그렇다'는 so + 조동사 + 주어 순서로 씁니다. 앞 문장이 일반동사 현재형이므로 대동사 do를 쓰고, my brother에 맞춰 does가 됩니다."}], "hyunam1": [{"id": "g1-01", "ko": "그가 그 제안을 거절한 이유는 그 조건이 불공평했기 때문이었다.", "en": "The reason why he rejected the offer was that the conditions were unfair.", "condition": "[조건] The reason why ~ was that ... 구문 / 13단어", "tag": "이유의 that절", "blank": "The reason why he rejected the offer was ____ the conditions were unfair.", "hint": "that", "answer": "that", "accept": ["that"], "expl": "The reason why ~ was that ...에서 was 뒤에는 이유를 설명하는 that절이 옵니다. because를 쓰면 reason과 의미가 겹쳐 어색해집니다."}, {"id": "g1-02", "ko": "이것은 내가 어릴 때 살았던 집이다.", "en": "This is the house where I lived when I was young.", "condition": "[조건] 관계부사 where / 11단어", "tag": "관계부사(where)", "blank": "This is the house ____ I lived when I was young.", "hint": "where", "answer": "where", "accept": ["where"], "expl": "선행사가 장소이고 뒤 문장이 완전한 형태이므로 관계부사 where를 씁니다. 관계대명사 which를 쓰려면 in which가 되어야 합니다."}, {"id": "g1-03", "ko": "그 문제가 해결된 상태여서, 우리는 다음 단계로 넘어갈 수 있었다.", "en": "With the problem solved, we could move on to the next step.", "condition": "[조건] With + 명사 + 과거분사 / 12단어", "tag": "독립분사구문(with)", "blank": "With the problem ____ (solve), we could move on to the next step.", "hint": "solve", "answer":  뜻입니다. be동사는 were를 쓰고, 해석은 현재 상황의 반대입니다."}, {"id": "p1-11", "ko": "영어는 전 세계에서 말해진다.", "en": "English is spoken all over the world.", "condition": "[조건] 현재시제 수동태 / 7단어", "tag": "수동태", "blank": "English is ____ (speak) all over the world.", "hint": "speak", "answer": "spoken", "accept": ["spoken"], "expl": "수동태는 be동사 + 과거분사입니다. speak의 과거분사는 spoken이며, 지금의 일반적인 사실이므로 is를 씁니다."}, {"id": "p1-12", "ko": "그 다리는 1990년에 지어졌다.", "en": "The bridge was built in 1990.", "condition": "[조건] 과거시제 수동태 / 6단어", "tag": "수동태(과거)", "blank": "The bridge was ____ (build) in 1990.", "hint": "build", "answer": "built", "accept": ["built"], "expl": "1990년이라는 과거 시점이므로 be동사를 was로 쓰고, build의 과거분사 built를 붙입니다."}, {"id": "p1-13", "ko": "그 문제는 곧 해결될 것이다.", "en": "The problem will be solved soon.", "condition": "[조건] 조동사 + be p.p. / 6단어", "tag": "수동태(조동사)", "blank": "The problem will be ____ (solve) soon.", "hint": "solve", "answer": "solved", "accept": ["solved"], "expl": "조동사가 있는 수동태는 will be + 과거분사 형태입니다. be를 빠뜨리면 will solved가 되어 틀립니다."}, {"id": "p1-14", "ko": "그는 그 책을 받았다.", "en": "He was given the book.", "condition": "[조건] 4형식의 수동태 / 5단어", "tag": "수동태(4형식)", "blank": "He was ____ (give) the book.", "hint": "give", "answer": "given", "accept": ["given"], "expl": "4형식 문장을 수동태로 바꿀 때 간접목적어를 주어로 세우면 'be given + 직접목적어'가 됩니다. give의 과거분사는 given입니다."}, {"id": "p1-15", "ko": "새 학교가 지어지고 있다.", "en": "A new school is being built.", "condition": "[조건] 진행형 수동태 / 6단어", "tag": "수동태(진행)", "blank": "A new school is ____ (build).", "hint": "build", "answer": "being built", "accept": ["being built"], "expl": "진행형 수동태는 be + being + p.p.입니다. '지어지고 있는 중'이므로 is being built가 됩니다."}, {"id": "p1-16", "ko": "날씨가 좋아서, 우리는 산책을 나갔다.", "en": "The weather being fine, we went out for a walk.", "condition": "[조건] 독립분사구문 / 10단어", "tag": "독립분사구문", "blank": "The weather ____ (be) fine, we went out for a walk.", "hint": "be", "answer": "being", "accept": ["being"], "expl": "분사구문의 주어가 주절의 주어(we)와 다르면 그 주어를 그대로 남깁니다. 이것이 독립분사구문이며 be동사 function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(arguments.length<2)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function nowStr(){var d=new Date();function p(n){return (n<10?'0':'')+n;}return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function todayStr(){var d=new Date();var WD=['일','월','화','수','목','금','토'];return d.getFullYear()+'. '+p2(d.getMonth()+1)+'. '+p2(d.getDate())+' ('+WD[d.getDay()]+')';}
function p2(n){return (n<10?'0':'')+n;}

function norm(s){
  s=String(s==null?'':s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
  s=s.toLowerCase().replace(/\s+/g,' ').trim();
  s=s.replace(/\s+([,.!?;:])/g,'$1');
  return s;
}
function stripTail(s){return s.replace(/[.!?]+$/,'');}
function sameText(a,b){
  var x=norm(a),y=norm(b);
  if(x===y||stripTail(x)===stripTail(y))return true;
  if(x.replace(/,/g,'')===y.replace(/,/g,''))return true;
  if(stripTail(x).replace(/,/g,'')===stripTail(y).replace(/,/g,''))return true;
  return false;
}

  var p1=Promise.resolve(),p2=Promise.resolve();
  if('serviceWorker' in navigator){p1=navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).catch(function(){});}
  if('caches' in window){p2=caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).catch(function(){});}
  try{sessionStorage.clear();}catch(err){}
  Promise.all([p1,p2]).then(function(){
    setTimeout(function(){
      var u=location.protocol+'//'+location.host+location.pathname;
      location.replace(u+'?v='+Date.now());
    },350);
  });
}

function doLogin(){

function records(){return store(RK)||{};}
function myRec(setId,mode){
  var all=records(),u=all[userKey()]||{},s=u[setId]||{},m=s[mode];
  return m||null;
}
function saveRec(setId,mode,score,wrong,total,fullTotal){
  var all=records(),u=all[userKey()]||{},s=u[setId]||{},m=s[mode]||{best:0,tries:0};
  m.tries=(m.tries||0)+1;
  if(total===fullTotal)m.best=Math.max(m.best||0,score);
  else if(m.best==null)m.best=score;
  m.last=score;m.total=total;m.wrong=wrong.slice();m.at=nowStr();m.full=fullTotal;
  if(total===fullTotal)m.done=true;
  s[mode]=m;u[setId]=s;all[userKey()]=u;store(RK,all);
}

  var total=set.items.length;
  var rows=MODES.map(function(m){

    var stat=r?('<span class="'+(r.best>=90?'chip ok':'chip')+'">최고 '+r.best+'점</span>'+(r.done?' <span class="chip ok" style="font-size:10.5px">완료</span>':'')+' <span class="sub" style="font-size:11.5px">'+r.tries+'회</span>'):'<span class="sub" style="font-size:12px">아직 안 풀었어요</span>';
    return '<button class="modebtn" onclick="startMode(\''+set.id+'\',\''+m.key+'\')">'+
      '<span class="num">'+m.no+'</span>'+
      '<span class="mt"><span class="mn">'+m.name+'</span><span class="md">'+m.desc+'</span></span>'+
      '<span class="ms">'+stat+'</span></button>';
  }).join('');
  var wrongRows=MODES.map(function(m){
    var r=myRec(set.id,m.key);
    if(!r||!r.wrong||!r.wrong.length)return '';
    return '<button class="modebtn" onclick="startMode(\''+set.id+'\',\''+m.key+'\',true)" style="background:#fffbeb;border-color:#fde68a">'+

      '<span class="mt"><span class="mn">오답만 다시 풀기 · '+m.name+'</span><span class="md">틀린 '+r.wrong.length+'문항</span></span>'+
      '<span class="ms" style="color:#b45309">다시 풀기</span></button>';
  }).join('');
  return '<div class="card">'+
    '<h2 style="margin-bottom:2px">'+esc(set.name)+((free||set.practice)?' <span class="chip">연습용</span>':'')+'</h2>'+
    '<div class="sub" style="margin-bottom:2px">'+esc(set.sub)+' · 총 '+total+'문항</div>'+
    (set.note?'<div class="sub" style="font-size:11.5px;color:#94a3b8;margin-bottom:6px">'+esc(set.note)+'</div>':'<div style="height:6px"></div>')+
    rows+(wrongRows?'<div class="tsec">오답 노트</div>'+wrongRows:'')+
    '</div>';
}

/* ================= 문제 풀이 ================= */
function startMode(setId,mode,wrongOnly){
  var set=getSet(setId);
  if(!set)return;
  var ids=set.items.map(function(it){return it.id;});
  if(wrongOnly){
    var r=myRec(setId,mode);
    if(!r||!r.wrong||!r.wrong.length){toast('다시 풀 오답이 없습니다.');return;}
    ids=r.wrong.slice();
  }
  S.play={setId:setId,mode:mode,ids:ids,idx:0,answers:[],correct:0,sel:[],pool:[],order:{},done:false};
  renderPlay();
}

function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}
  return r;
}
function tokensOf(it){
  return it.en.split(' ').filter(function(t){return t!==' ';});
}

function renderPlay(){
  var p=S.play,set=getSet(p.setId),it=findItem(set,p.ids[p.idx]);
  var mode=MODES.filter(function(m){return m.key===p.mode;})[0];
  var pct=Math.round((p.idx/p.ids.length)*100);
  var head='<div class="top"><button class="back" onclick="quitPlay()">← 나가기</button>'+
    '<div class="grow"><div class="title" style="font-size:17px">'+mode.no+' '+mode.name+'</div>'+
    '<div class="sub">'+esc(set.name)+' · '+(p.idx+1)+' / '+p.ids.length+'</div></div>'+refreshStyle()+'</div>'+
    '<div class="progbar"><i style="width:'+pct+'%"></i></div>';

  var body='<div class="card">'+
    '<div class="qhead"><span class="qno">문제 '+(p.idx+1)+'</span><span class="chip">'+esc(it.tag)+'</span></div>'+
    '<div class="ko">'+esc(it.ko)+'</div>'+
    '<div class="cond">'+esc(it.condition)+'</div>';

  if(p.mode==='scramble'){
    if(!p.order[p.idx]){p.order[p.idx]=shuffle(tokensOf(it));p.sel=[];}
    var pool=p.order[p.idx];
    var used={};p.sel.forEach(function(u){used[u.i]=1;});
    var selHtml=p.sel.length?p.sel.map(function(u,k){
      return '<button class="sel" onclick="unpick('+k+')"><span class="o">'+(k+1)+'</span>'+esc(u.t)+'</button>';
    }).join(''):'<span class="ph">아래 단어 블록을 순서대로 눌러 보세요</span>';
    body+='<div class="ansslot" id="ansslot">'+selHtml+'</div>'+
      '<div class="pool" id="pool">'+pool.map(function(t,i){
        if(used[i])return '';
        return '<button class="word" onclick="pick('+i+')">'+esc(t)+'</button>';
      }).join('')+'</div>'+
      '<div class="row" style="margin-top:12px"><button class="btn ghost" style="margin:0" onclick="resetScramble()">↺ 전체 지우기</button>'+
      '<button class="btn" style="margin:0" id="btn_submit" onclick="submitAnswer()" '+(p.sel.length===pool.length?'':'disabled')+'>제출하기</button></div>';
  }else if(p.mode==='blank'){
    var parts=it.blank.split('____');
    body+='<div class="sentline">'+esc(parts[0])+'<input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력" aria-label="빈칸 답">'+(parts[1]?esc(parts[1]):'')+'</div>'+
      '<div class="hintchip">제시어: '+esc(it.hint)+'</div>'+
      '<div class="row" style="margin-top:14px"><button class="btn" style="margin:0" id="btn_submit" onclick="submitAnswer()">제출하기</button></div>';
  }else{
    body+='<textarea id="inp" class="writing" rows="3" placeholder="영어 문장을 그대로 써 보세요" autocapitalize="off" spellcheck="false" aria-label="영작 답"></textarea>'+
      '<div class="sub" style="font-size:12px;margin-top:6px">대소문자·마침표는 달라도 정답으로 채점합니다.</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn" style="margin:0" id="btn_submit" onclick="submitAnswer()">제출하기</button></div>';
  }
  body+='<div id="fbbox"></div></div>';
  app.innerHTML=head+body;
  bindRefresh();
  var inp=document.getElementById('inp');
  if(inp){
    inp.focus();
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitAnswer();}
    });
  }
  window.scrollTo(0,0);
}

function pick(i){
  var p=S.play,it=findItem(getSet(p.setId),p.ids[p.idx]);
  var pool=p.order[p.idx];
  if(p.sel.some(function(u){return u.i===i;}))return;
  p.sel.push({i:i,t:pool[i]});
  paintScramble();
}
function unpick(k){
  S.play.sel.splice(k,1);
  paintScramble();
}
function resetScramble(){
  S.play.sel=[];
  paintScramble();
}
/* 답을 고를 때는 문장 영역만 다시 그려서 화면이 튀지 않게 한다 */
function paintScramble(){
  var p=S.play;if(!p||p.mode!=='scramble')return;
  var pool=p.order[p.idx];
  var used={};p.sel.forEach(function(u){used[u.i]=1;});
  var slot=document.getElementById('ansslot');
  if(slot){
    slot.innerHTML=p.sel.length?p.sel.map(function(u,k){
      return '<button class="sel" onclick="unpick('+k+')"><span class="o">'+(k+1)+'</span>'+esc(u.t)+'</button>';
    }).join(''):'<span class="ph">아래 단어 블록을 순서대로 눌러 보세요</span>';
  }
  var pb=document.getElementById('pool');
  if(pb){
    pb.innerHTML=pool.map(function(t,i){
      if(used[i])return '';
      return '<button class="word" onclick="pick('+i+')">'+esc(t)+'</button>';
    }).join('');
  }
  var btn=document.getElementById('btn_submit');
  if(btn&&!p.done)btn.disabled=(p.sel.length!==pool.length);
}
function quitPlay(){
  if(!confirm('지금 나가면 이번 풀이는 기록되지 않습니다. 나갈까요?'))return;
  S.play=null;showHome();
}

function currentMine(it){
  var p=S.play;
  if(p.mode==='scramble')return p.sel.map(function(u){return u.t;}).join(' ');
  var inp=document.getElementById('inp');
  return inp?inp.value.trim():'';
}
function isCorrect(it,mine){
  var p=S.play;
  if(p.mode==='scramble')return sameText(mine,it.en);
  if(p.mode==='blank'){
    for(var i=0;i<it.accept.length;i++)if(sameText(mine,it.accept[i]))return true;
    return false;
  }
  if(sameText(mine,it.en))return true;
  var alts=it.enAlt||[];
  for(var j=0;j<alts.length;j++)if(sameText(mine,alts[j]))return true;
  return false;
}

function submitAnswer(){
  var p=S.play;if(p.done)return;
  var set=getSet(p.setId),it=findItem(set,p.ids[p.idx]);
  var mine=currentMine(it);
  if(p.mode==='scramble'&&p.sel.length!==p.order[p.idx].length){toast('블록을 모두 사용해 문장을 만드세요.');return;}
  if(!mine){toast('답을 입력해 주세요.');return;}
  var ok=isCorrect(it,mine);
  p.done=true;
  p.answers.push({id:it.id,mine:mine,ok:ok});
  if(ok)p.correct++;
  var sb=document.getElementById('btn_submit');if(sb)sb.disabled=true;
  var inp=document.getElementById('inp');if(inp)inp.disabled=true;
  if(p.mode==='scramble'){
    var ws=document.querySelectorAll('#pool .word');for(var i=0;i<ws.length;i++)ws[i].disabled=true;
    var ss=document.querySelectorAll('.ansslot .sel');for(var k=0;k<ss.length;k++)ss[k].disabled=true;
  }
  var keyTxt=(p.mode==='blank')?(it.blank.replace('____','['+it.answer+']').replace(/\s*\([^)]*\)/g,'')):'';
  var fb=document.getElementById('fbbox');
  fb.innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+
    '<div class="fbhead">'+(ok?'✅ 정답입니다!':'❌ 아쉬워요 — 정답과 비교해 보세요')+'</div>'+
    '<div class="cmp">'+
      '<div class="col mine"><div class="lbl">내 답</div><div class="val">'+esc(mine)+'</div></div>'+
      '<div class="col best"><div class="lbl">모범 정답</div><div class="val">'+esc(it.en)+'</div></div>'+
    '</div>'+
    (keyTxt?'<div class="sub" style="font-size:12.5px;margin-top:8px">빈칸 완성형: <b>'+esc(keyTxt)+'</b></div>':'')+
    '<div class="exp"><b>문법 포인트 · '+esc(it.tag)+'</b><p>'+esc(it.expl)+'</p></div>'+
    '<button class="btn" style="margin-top:12px" onclick="nextItem()">'+(p.idx+1<p.ids.length?'다음 문제 →':'결과 보기 →')+'</button>'+
  '</div>';
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function nextItem(){
  var p=S.play;
  p.idx++;p.done=false;p.sel=[];
  if(p.idx>=p.ids.length){showResult();return;}
  renderPlay();
}

function showResult(){
  var p=S.play,set=getSet(p.setId),mode=MODES.filter(function(m){return m.key===p.mode;})[0];
  var total=p.answers.length,correct=p.correct;
  var score=total?Math.round(correct/total*100):0;
  var wrong=p.answers.filter(function(a){return !a.ok;}).map(function(a){return a.id;});
  saveRec(p.setId,p.mode,score,wrong,total,set.items.length);
  var items=p.answers.map(function(a){
    var it=findItem(set,a.id);
    return {id:a.id,ok:a.ok,mine:a.mine,it:it};
  });
  var wrongHtml=items.filter(function(x){return !x.ok;}).map(function(x){
    return '<div class="wrongitem"><div class="wk">'+esc(x.it.ko)+'</div>'+
      '<div class="wa">내 답: '+esc(x.mine||'(비움)')+'<br>정답: <b>'+esc(x.it.en)+'</b></div>'+
      '<details><summary>해설 보기</summary><p>'+esc(x.it.expl)+'</p></details></div>';
  }).join('');
  var html='<div class="top"><button class="back" onclick="quitPlay()">← 나가기</button>'+
    '<div class="grow"><div class="title" style="font-size:17px">'+mode.no+' '+mode.name+' 결과</div>'+
    '<div class="sub">'+esc(set.name)+'</div></div>'+refreshStyle()+'</div>'+
    '<div class="card"><div class="score"><div class="num">'+score+'</div><div class="lbl">'+correct+' / '+total+' 정답 · 정답률 '+score+'%</div></div>'+
    '<div style="text-align:center;margin-top:6px">'+
      (score===100?'<span class="chip ok">완벽해요! 전부 정답 🎉</span>':(score>=80?'<span class="chip">좋아요! 오답만 잡으면 완벽해요</span>':'<span class="chip warn">오답을 꼭 다시 풀어 봐요</span>'))+
    '</div>'+
    '<div class="row" style="margin-top:14px">'+
      (wrong.length?'<button class="btn" style="margin:0" onclick="startMode(\''+p.setId+'\',\''+p.mode+'\',true)">🔁 오답 '+wrong.length+'문항 다시 풀기</button>':'')+
    '</div>'+
    '<div class="row" style="margin-top:8px">'+
      '<button class="btn gray" style="margin:0" onclick="startMode(\''+p.setId+'\',\''+p.mode+'\')">처음부터 다시</button>'+
      '<button class="btn gray" style="margin:0" onclick="S.play=null;showHome()">홈으로</button>'+
    '</div></div>'+
    (wrongHtml?'<div class="card"><h2>오답 노트</h2>'+wrongHtml+'</div>':'');
  app.innerHTML=html;
  bindRefresh();
  window.scrollTo(0,0);
}

/* ================= 선생님 ================= */
function showTeacher(){
  if(!S.me||!S.me.teacher){showTeacherLogin();return;}
  var totalItems=SETS.reduce(function(a,s){return a+(s.practice?0:s.items.length);},0);
  var recs=records(),students=Object.keys(recs).filter(function(k){return k!=='teacher';});
  var html='<div class="top"><div class="grow"><div class="title">선생님 화면 👩‍🏫 <span class="ver">'+APP_VER+'</span></div>'+
    '<div class="sub">서술형 시험지 인쇄 · 전체 세트 미리보기</div></div><a class="back" href="index.html" style="text-decoration:none">🏠 단어앱</a>'+refreshStyle()+'</div>'+
    '<div class="card"><h2>세트 현황</h2>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;background:var(--rule);border-radius:12px;padding:10px 4px">'+
      '<div><b style="font-size:22px;color:var(--pri)">'+SETS.filter(function(s){return !s.practice;}).length+'</b><div class="sub" style="font-size:11.5px">반 세트</div></div>'+
      '<div style="border-left:1px dashed var(--line);border-right:1px dashed var(--line)"><b style="font-size:22px;color:var(--pri)">'+totalItems+'</b><div class="sub" style="font-size:11.5px">전체 문항</div></div>'+
      '<div><b style="font-size:22px;color:var(--pri)">'+students.length+'</b><div class="sub" style="font-size:11.5px">학습 기록</div></div>'+
    '</div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn" style="margin:0" onclick="showPrintPreview(\'ALL\',true)">🖨️ 전체 시험지 인쇄</button>'+
      '<button class="btn gray" style="margin:0" onclick="showPrintPreview(\'ALL\',false)">문제지만 인쇄</button>'+
    '</div></div>';

  html+=SETS.map(function(s){
    return '<div class="card"><h2 style="margin-bottom:2px">'+esc(s.name)+'</h2>'+
      '<div class="sub" style="margin-bottom:2px">'+esc(s.sub)+' · '+s.items.length+'문항</div>'+
      (s.note?'<div class="sub" style="font-size:11.5px;color:#94a3b8;margin-bottom:6px">'+esc(s.note)+'</div>':'<div style="height:6px"></div>')+
      '<div class="row">'+
        '<button class="btn ghost" style="margin:0;font-size:15px" onclick="previewSet(\''+s.id+'\')">👀 미리보기</button>'+
        '<button class="btn" style="margin:0;font-size:15px" onclick="showPrintPreview(\''+s.id+'\',true)">🖨️ 시험지 인쇄</button>'+
      '</div>'+
      '<div class="sub" style="font-size:11.5px;margin-top:8px">'+tagSummary(s)+'</div>'+
    '</div>';
  }).join('');
  html+='<div class="row" style="margin-top:12px"><button class="btn gray" style="margin:0" onclick="showLogin()">로그아웃</button></div>';
  app.innerHTML=html;
  bindRefresh();
}

function tagSummary(s){
  var tags=s.items.map(function(it){return esc(it.tag);}).filter(function(v,i,a){return a.indexOf(v)===i;});
  if(tags.length<=6)return tags.join(' · ');
  return tags.slice(0,6).join(' · ')+' 외 '+(tags.length-6)+'개';
}

function previewSet(id){
  var set=getSet(id);
  var html='<div class="top"><button class="back" onclick="showTeacher()">← 선생님 화면</button>'+
    '<div class="grow"><div class="title" style="font-size:17px">'+esc(set.name)+' 미리보기</div>'+
    '<div class="sub">'+set.items.length+'문항 · 정답과 해설 포함</div></div>'+refreshStyle()+'</div>';
  html+='<div class="card">';
  set.items.forEach(function(it,i){
    html+='<div class="titem"><div class="tko">'+(i+1)+'. '+esc(it.ko)+'</div>'+
      '<div class="tmeta">'+esc(it.condition)+' · '+esc(it.tag)+'</div>'+
      '<details><summary>정답 · 해설</summary><p><b>'+esc(it.en)+'</b><br>빈칸: '+esc(it.blank)+' → '+esc(it.answer)+'<br>'+esc(it.expl)+'</p></details></div>';
  });
  html+='</div><div class="row" style="margin-top:10px"><button class="btn" style="margin:0" onclick="showPrintPreview(\''+id+'\',true)">🖨️ 이 세트 시험지 인쇄</button></div>';
  app.innerHTML=html;
  bindRefresh();
  window.scrollTo(0,0);
}

function printSets(key){
  if(key==='ALL')return SETS.filter(function(s){return !s.practice;});
  var s=getSet(key);return s?[s]:[];
}

function buildSheetHTML(sets,withAnswers){
  var out='';
  var secLetter='A';
  sets.forEach(function(set){
    var q='';
    set.items.forEach(function(it,i){
      q+='<div class="p-q"><div class="p-num">'+(i+1)+'</div><div class="p-body">'+
        '<div class="p-ko">'+esc(it.ko)+'</div>'+
        '<div class="p-cond">'+esc(it.condition)+'</div>'+
        (it.hint&&norm(it.hint)!==norm(it.answer)?'<div class="p-cond">제시어: '+esc(it.hint)+'</div>':'')+
        '<div class="p-line"></div><div class="p-line"></div></div></div>';
    });
    out+='<div class="p-page">'+
      '<div class="p-head"><div class="p-title">수지탑에듀 내신 서술형 대비 문제지</div>'+
      '<div class="p-sub">'+esc(set.name)+' · '+esc(set.sub)+' · '+set.items.length+'문항</div>'+
      '<div class="p-name"><span>반: '+esc(set.name)+'</span><span>이름: ______________</span><span>점수: ______ / '+set.items.length+'</span></div></div>'+
      '<div class="p-sec">서술형 — 한글 해석과 [조건]에 맞게 영어 문장을 완성하시오.</div>'+
      q+
      '<div class="p-note">'+todayStr()+' · 수지탑에듀 · 각 문항 5점</div></div>';
  });
  if(withAnswers){
    sets.forEach(function(set){
      var a='';
      set.items.forEach(function(it,i){
        a+='<div class="p-q"><div class="p-num">'+(i+1)+'</div><div class="p-body">'+
          '<div class="p-ans">'+esc(it.en)+'</div>'+
          '<div class="p-cond">['+esc(it.tag)+'] 빈칸: '+esc(it.blank)+' → '+esc(it.answer)+'</div>'+
          '<div class="p-ans"><span class="ex">'+esc(it.expl)+'</span></div></div></div>';
      });
      out+='<div class="p-page"><div class="p-head"><div class="p-title">정답 및 해설</div>'+
        '<div class="p-sub">'+esc(set.name)+' · '+set.items.length+'문항</div></div>'+a+
        '<div class="p-note">수지탑에듀 내신 서술형 · '+todayStr()+'</div></div>';
    });
  }
  return out;
}

function showPrintPreview(key,withAnswers){
  var sets=printSets(key);
  if(!sets.length){toast('세트를 찾을 수 없습니다.');return;}
  var pr=document.getElementById('printRoot');
  pr.innerHTML='<div class="p-bar"><span>인쇄 미리보기 · '+sets.map(function(s){return s.name;}).join(' + ')+' · '+(withAnswers?'문제지+정답해설':'문제지만')+'</span><span class="sp"></span>'+
    '<button onclick="doPrint()">🖨️ 인쇄하기</button>'+
    '<button class="g" onclick="closePrint()">닫기</button></div>'+
    buildSheetHTML(sets,withAnswers);
  pr.className='preview';
  pr.scrollTop=0;
}
function closePrint(){
  var pr=document.getElementById('printRoot');
  pr.className='';pr.innerHTML='';
}
function doPrint(){window.print();}

/* ================= 시작 ================= */
(function boot(){
  var saved=store(UK);
  if(saved&&saved.name){
    S.me=saved;
    if(saved.teacher)showTeacher();else showHome();
  }else showLogin();
})();
</script>
