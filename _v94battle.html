<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v94 퀴즈 대결 전수 검증 (단어·문장)</title>
<style>
  html,body{margin:0;background:#0b1220;color:#cbd5e1;font:12px/1.45 ui-monospace,SFMono-Regular,monospace}
  #bar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid #1e293b;background:#111827}
  #bar button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:5px 10px;font:700 12px/1 ui-monospace,monospace;cursor:pointer}
  #bar button.on{background:#0d9488;border-color:#0d9488;color:#fff}
  #status{padding:6px 10px;white-space:pre-wrap;color:#fff}
  #stage{padding:8px 10px}
  .dev{display:none}
  .dev.on{display:block}
  iframe{border:2px solid #334155;background:#fff;display:block}
  .cap{color:#94a3b8;margin-bottom:3px}
</style>
</head>
<body>
<div id="bar">
  <button data-v="t" class="on">👩‍🏫 선생님</button>
  <span id="sbtns"></span>
  <button data-v="all">모두 보기</button>
</div>
<div id="status">준비 중…</div>
<div id="stage"></div>
<script>
/* v94 퀴즈 대결 검증 하네스 — 기기(iframe)마다 세션을 따로 세팅하고 한 번에 한 기기만 크게 띄운다.
   ?nobc=1 이므로 같은 기기용 BroadcastChannel은 꺼지고 실시간 허브(MQTT)만으로 통신한다. */
var q = new URLSearchParams(location.search);
var ban = q.get('ban') || '수지중2';
var stus = (q.get('st') || '').split(',').filter(Boolean).map(function (x) {
  var p = x.split(':');
  return { name: p[0], pw: p[1] || '' };
});
var vq = q.get('v') || '94';
var base = 'index.html?nobc=1&v=' + vq;

function mkDev(id, label, w, h) {
  var d = document.createElement('div');
  d.className = 'dev' + (id === 't' ? ' on' : '');
  d.id = 'dev-' + id;
  d.innerHTML = '<div class="cap">' + label + '</div>';
  var f = document.createElement('iframe');
  f.id = id; f.title = id;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  d.appendChild(f);
  document.getElementById('stage').appendChild(d);
  return f;
}
var tf = mkDev('t', '👩‍🏫 선생님(칠판) · ' + ban + ' · 1180×900', 1180, 900);
stus.forEach(function (s, i) {
  mkDev('s' + (i + 1), '📱 학생' + (i + 1) + ' · ' + s.name + ' · ' + ban + ' · 390×844', 390, 844);
  var b = document.createElement('button');
  b.textContent = '학생' + (i + 1) + ' ' + s.name;
  b.dataset.v = 's' + (i + 1);
  document.getElementById('sbtns').appendChild(b);
});
function show(v) {
  [].forEach.call(document.querySelectorAll('.dev'), function (d) {
    d.classList.toggle('on', v === 'all' ? true : d.id === 'dev-' + v);
  });
  [].forEach.call(document.querySelectorAll('#bar button'), function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });
  if (v === 'all') {
    [].forEach.call(document.querySelectorAll('.dev iframe'), function (f) {
      f.style.width = '360px'; f.style.height = '700px';
    });
  } else if (v === 't') {
    tf.style.width = '1180px'; tf.style.height = '900px';
  } else {
    var f = document.getElementById(v);
    f.style.width = '390px'; f.style.height = '844px';
  }
}
[].forEach.call(document.querySelectorAll('#bar button'), function (b) {
  b.onclick = function () { show(b.dataset.v); };
});

function seed(i) {
  try {
    if (i < 0) localStorage.removeItem('cred');
    else localStorage.setItem('cred', JSON.stringify({ ban: ban, name: stus[i].name, pw: stus[i].pw }));
  } catch (e) {}
}
function chain(i) {
  if (i >= stus.length) return;
  var f = document.getElementById('s' + (i + 1));
  seed(i);
  f.onload = function () { f.onload = null; setTimeout(function () { chain(i + 1); }, 500); };
  f.src = base + '&stu=' + encodeURIComponent(stus[i].name) + '&t=' + Date.now();
}
seed(-1);
tf.onload = function () { tf.onload = null; setTimeout(function () { chain(0); }, 500); };
tf.src = base + '&t=' + Date.now();

function txt(doc, id) {
  var el = doc && doc.getElementById(id);
  return el ? String(el.textContent || '').trim().replace(/\s+/g, ' ') : '';
}
function line(id, label) {
  try {
    var f = document.getElementById(id), w = f.contentWindow, d = f.contentDocument;
    if (!w || !d || !d.body || !String(d.body.innerHTML || '').trim()) return label + ': (로드 중)';
    var errs = w.__topeduErrors || [];
    var h = d.querySelector('h1');
    var net = txt(d, 'bnet') || txt(d, 'stu_net');
    var rdy = txt(d, 'rdy');
    var out = label + ' | ' + (w.TOPEDU_APP_VERSION || '?') + ' | ' + (h ? h.textContent : '—');
    if (net) out += ' | ' + net;
    if (rdy) out += ' | ' + rdy;
    out += ' | 오류 ' + errs.length;
    if (errs.length) out += ' ↳ ' + errs.slice(0, 2).join(' / ');
    return out;
  } catch (e) { return label + ': ' + e; }
}
function tick() {
  var L = ['실서버 ' + location.origin + ' ' + new Date().toLocaleTimeString('ko-KR') + ' · ' + ban, line('t', '선생님')];
  stus.forEach(function (s, i) { L.push(line('s' + (i + 1), '학생' + (i + 1) + ' ' + s.name)); });
  document.getElementById('status').textContent = L.join('\n');
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
