<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 수지탑에듀학원 기말 영어 단어 카드 🌸</title>
<meta name="description" content="수지탑에듀학원 매일 새 단어 + 에빙하우스 복습 · 출석 도장 · 오답 노트">
<meta property="og:title" content="수지탑에듀학원 기말 영어 단어 카드">
<meta property="og:description" content="매일 새 단어 15개 + 에빙하우스 자동 복습 · 출석 도장 · 오답 노트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
@font-face {
  font-family: 'Maplestory';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: 'Maplestory';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFLight.woff') format('woff');
  font-weight: 400;
  font-display: swap;
}
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: 수지탑에듀 핑크 에디션 배너 + 딸기우유빛 파스텔 카드 */
:root {
  --bg: #fff5f8;
  --paper: #ffffff;
  --ink: #2b1f24;
  --muted: #8c727a;
  --line: #ffd1dc;
  --rule: #ffeef2;
  --margin: #ffb3c6;
  --accent: #ff5c8a;
  --banner: linear-gradient(135deg, #ff5c8a, #ff758c);
  --accent-ink: #ffffff;
  --soft: #fff0f4;
  --note: #fff6d6;
  --note-ink: #5b4a12;
  --good: #1f9d63;
  --good-bg: #e6f6ee;
  --bad: #d63939;
  --bad-bg: #fde8e8;
  --warn: #e8590c;
  --en: "Maplestory", "Pretendard", -apple-system, sans-serif;
  --ko: "Maplestory", "Pretendard", -apple-system, sans-serif;
  --shadow: 0 4px 14px rgba(255, 92, 138, 0.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg: #1f1418;
  --paper: #2b1c22;
  --ink: #faedf2;
  --muted: #b89ca6;
  --line: #4d2f3b;
  --rule: #3d242e;
  --margin: #8c435e;
  --accent: #ff758c;
  --banner: linear-gradient(135deg, #e04875, #ff758c);
  --accent-ink: #ffffff;
  --soft: #38212a;
  --note: #3a321a;
  --note-ink: #f0dc9c;
  --good: #7fd6a0;
  --good-bg: #1d3326;
  --bad: #ff8f8f;
  --bad-bg: #3d2226;
  --warn: #e3b55c;
  --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg: #1f1418;
  --paper: #2b1c22;
  --ink: #faedf2;
  --muted: #b89ca6;
  --line: #4d2f3b;
  --rule: #3d242e;
  --margin: #8c435e;
  --accent: #ff758c;
  --banner: linear-gradient(135deg, #e04875, #ff758c);
  --accent-ink: #ffffff;
  --soft: #38212a;
  --note: #3a321a;
  --note-ink: #f0dc9c;
  --good: #7fd6a0;
  --good-bg: #1d3326;
  --bad: #ff8f8f;
  --bad-bg: #3d2226;
  --warn: #e3b55c;
  --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

/* Class Filter Bar */
.class-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  margin-bottom: 8px;
  scrollbar-width: none;
}
.class-bar::-webkit-scrollbar { display: none; }
.c-chip {
  flex-shrink: 0;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--ko);
}
.c-chip.on {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(255, 92, 138, 0.35);
}
.banner{background:var(--banner);color:#fff;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.banner .lab{font-size:12px;opacity:.9}
.banner .t{font-weight:700;font-size:21px;line-height:1.3}
.banner .s{font-size:12.5px;opacity:.95}
.chiplab{display:inline-block;border:1px solid var(--margin);color:var(--accent);font-size:12px;padding:1px 8px;margin-right:6px}
.noteb{background:var(--note);color:var(--note-ink);border-radius:8px;padding:9px 12px;font-size:13px}
.noteb b{color:inherit}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ko);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:21px;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.cloud{background:var(--good)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:500}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
/* 문제집 카드: 위쪽 보라 밑줄 머리 + 라벤더 바탕 줄 */
.idx{background-image:linear-gradient(var(--paper) 46px, var(--accent) 46px, var(--accent) 47.5px, transparent 47.5px),repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px);}
h1,h2,.mean,.score{color:var(--accent)}
h2{border-bottom:1px solid var(--margin);padding-bottom:3px}
.set{display:flex;flex-direction:column;gap:10px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line)}
.set .nm{font-weight:700;font-size:17px;line-height:30px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .x{background:var(--bad)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.rlist{display:flex;flex-direction:column;gap:8px;width:100%}
.ritem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.ritem .btn{padding:7px 12px;flex:none}
.ritem.ask{border-color:var(--bad);background:var(--bad-bg)}
.rbtns{display:flex;gap:6px;align-items:center;flex:none}
.xbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 9px;font-size:12.5px}
.xbtn.wide{border:0;text-decoration:underline;align-self:center;padding:2px}
.going{color:var(--warn);font-size:12px;margin-top:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
:root[data-theme="dark"] .btn.bad,:root[data-theme="dark"] .btn.good{color:#10181c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.bad,:root:not([data-theme="light"]) .btn.good{color:#10181c}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.mode b{font-size:16px} .mode span{font-size:12.5px;color:var(--muted)}
.mode.wrong{border-color:var(--bad)} .mode.wrong b{color:var(--bad)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
.prog .bar i{background:var(--accent)}
.flip{min-height:300px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;user-select:none}
.tag{font-size:12px;color:var(--muted);line-height:28px;display:flex;justify-content:space-between;gap:8px}
.word{font-family:var(--en);font-size:clamp(28px,8vw,38px);font-weight:700;line-height:1.15;margin-top:30px;overflow-wrap:anywhere}
.ipa{font-family:var(--en);color:var(--muted);font-size:15px}
.mean{font-size:22px;font-weight:700;color:var(--accent)}
.ex{font-family:var(--en);font-size:15.5px;line-height:1.6}
.exk{font-size:13.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-family:var(--en);overflow-wrap:anywhere}
.hint{margin-top:auto;font-size:12.5px;color:var(--muted);text-align:center}
.row{display:flex;gap:10px} .row>*{flex:1}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:38px;height:38px;flex:none;display:inline-grid;place-items:center}
.speak svg{width:18px;height:18px;fill:var(--accent)}
.q{padding:18px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px;display:flex;gap:10px}
.opt .no{color:var(--muted);font-variant-numeric:tabular-nums}
.opt.en{font-family:var(--en)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrongpick{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.inp{width:100%;font-family:var(--en);font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);box-sizing:border-box}
.inp.ok{border-color:var(--good)} .inp.no{border-color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .en{font-family:var(--en);font-weight:700}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .en{font-family:var(--en);font-weight:700}
.li .c{color:var(--bad);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.score{font-family:var(--en);font-size:44px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.danger{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:4px 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion: no-preference){.flipin{animation:pop .22s ease-out}@keyframes pop{from{transform:rotateX(70deg);opacity:.4}to{transform:none;opacity:1}}}
/* ---- B안 첫 화면 ---- */
.kicker{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.bb{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:20px 18px;position:relative;overflow:hidden;min-height:150px}
.bb::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.bb .btxt{position:relative;z-index:1;min-width:0}
.bb .t{font-size:27px;line-height:1.2;margin:4px 0 6px}
.deck{position:relative;width:118px;height:96px;flex:none;z-index:1}
.deck span{position:absolute;left:8px;top:14px;width:96px;height:64px;border-radius:9px;background:#fff;color:#5a3fc9;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(40,20,110,.25);border-top:4px solid #ffd76a}
.deck .c1{transform:rotate(-12deg) translate(-8px,6px);opacity:.75}
.deck .c2{transform:rotate(7deg) translate(10px,-4px);opacity:.88}
.deck .c3{transform:rotate(-2deg)}
@media (prefers-reduced-motion: no-preference){.deck .c3{animation:float 3.2s ease-in-out infinite}@keyframes float{50%{transform:rotate(-2deg) translateY(-4px)}}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.sum div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;gap:0}
.sum div+div{border-left:1px dashed var(--line)}
.sum b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.sum b.g{color:var(--good)} .sum b.r{color:var(--bad)}
.sum span{font-size:12px;color:var(--muted)}
.shelf{font-weight:700;color:var(--accent);border-bottom:1px solid var(--margin);padding-bottom:3px;margin-top:4px}
.setb{display:grid;grid-template-columns:72px 1fr 14px;gap:14px;align-items:center;padding:14px 14px 14px 12px;text-align:left;width:100%;border:1px solid var(--line);border-left:5px solid var(--accent)}
.setb:active{transform:translateY(1px)}
.ring{width:72px;height:72px}
.ring circle{fill:none;stroke-width:7}
.ring .rbg{stroke:var(--rule)} .ring .rk{stroke:var(--good);stroke-linecap:round} .ring .rx{stroke:var(--bad)}
.ring .rp{font-family:var(--ko);font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle}
.ring .rl{font-family:var(--ko);font-size:9px;fill:var(--muted);text-anchor:middle}
.sbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.shead{display:flex;align-items:center;justify-content:space-between}
.emb{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.emb svg{width:19px;height:19px;fill:var(--accent)}
.setb .nm{font-size:18px;font-weight:700;line-height:1.3}
.days{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.dayb{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dayb em{font-style:normal;text-align:right}
.mini{height:6px;border-radius:4px;background:var(--rule);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.wtag{align-self:flex-start;margin-top:4px;font-size:11.5px;color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:1px 9px}
.go{color:var(--margin);font-size:26px;line-height:1}
@media (max-width:380px){.deck{display:none}.setb{grid-template-columns:60px 1fr 10px;gap:10px}.ring{width:60px;height:60px}}
/* ---- 오늘의 학습 · 달력 · 계획 ---- */
.today{padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent)}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tlab{font-weight:700;font-size:19px;color:var(--accent)}
.tdate{font-size:13px;color:var(--muted)}
.dday{background:var(--bad);color:#fff;font-weight:700;border-radius:999px;padding:3px 11px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tnums{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:10px}
.tnums div{display:flex;flex-direction:column;align-items:center;padding:8px 4px}
.tnums div+div{border-left:1px dashed var(--margin)}
.tnums b{font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.tnums b.st{color:var(--warn)}
.tnums span{font-size:12px;color:var(--muted)}
.btn.big{padding:14px;font-size:17px}
.tdone{background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px 12px;font-weight:700;text-align:center}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.steps span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.steps em{font-style:normal;color:var(--accent)}
.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stage span{text-align:center;font-size:12.5px;border-radius:8px;padding:6px 2px;background:var(--soft);color:var(--muted)}
.stage span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.stage span.off{opacity:.4;text-decoration:line-through}
.cal{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;justify-content:space-between}
.chead b{color:var(--accent);font-size:16px}
.nav{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:34px;height:30px;font-size:18px;line-height:1;color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:11.5px;color:var(--muted)}
.cd{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:transparent;border-radius:50%;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.cd.e{visibility:hidden}
.cd.part{background:var(--soft);color:var(--accent)}
.cd.stamp{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:inset 0 0 0 2px var(--paper),0 0 0 1px var(--accent)}
.cd.tod{border-color:var(--warn);border-width:2px}
.cd.exam{background:var(--bad);color:#fff;font-weight:700}
.cd.sel{outline:2px solid var(--ink);outline-offset:1px}
.clegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.clegend b{color:var(--accent)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.lg.stamp{background:var(--accent)} .lg.part{background:var(--soft);border:1px solid var(--margin)} .lg.exam{background:var(--bad)}
.dsel{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dmiss{display:flex;flex-wrap:wrap;gap:5px}
.dmiss span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px}
.plan{padding:0}
.plan summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plan summary::-webkit-details-marker{display:none}
.plan summary b{color:var(--accent)}
.plan summary::after{content:"＋";color:var(--accent);font-weight:700}
.plan[open] summary::after{content:"－"}
.pbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.pl{font-size:13px;font-weight:700}
.inp.date{font-family:var(--ko);font-size:16px;padding:8px 10px}

const ORDER = ["sj2_ex1", "sj2_ex2", "sj2_voca1", "sj2_voca2", "hc1_ex1", "hc1_ex2", "hc1_ex3", "hc1_ex4", "hc1_ex5", "hc1_ex6", "hc1_ex7", "hc1_ex8", "hc1_ex9", "hc1_ex10", "pre_bbaba1", "pre_bbaba2", "pre_voca1", "pre_voca2", "sj1_voca1", "sj1_voca2", "pd6_voca1", "pd6_voca2", "ahmed", "mongoose", "ahmedx", "mongoosex"];

const INT = [1,2,4,7,15,30];            /* 간격 반복: 단계별 다음 복습까지 날짜 */
const blank = () => ({v:1, updatedAt:0, words:{}, sessions:{}, active:null, daily:{goal:15, auto:false, exam:null, plans:{}, log:{}}, vq:{r:{}, s:null}});
let st = blank(), sync = "local", dbRef = null;

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
function addDays(ds, n){ const [y,m,d] = ds.split("-").map(Number); return dstr(new Date(y, m-1, d+n)); }
function diffDays(a, b){ const [y1,m1,d1] = a.split("-").map(Number), [y2,m2,d2] = b.split("-").map(Number); return Math.round((new Date(y2,m2-1,d2) - new Date(y1,m1-1,d1)) / 864e5); }
const WD = ["일","월","화","수","목","금","토"];
function kdate(ds){ const [y,m,d] = ds.split("-").map(Number); return `${m}월 ${d}일 (${WD[new Date(y,m-1,d).getDay()]})`; }

/* 예전 형식 → 지금 형식 */
function migrate(o){
  if(!o.sessions) o.sessions = {};
  if(o.session){ if(!o.session.done) o.sessions[o.session.set + "|" + o.session.mode] = o.session; delete o.session; }
  if(!("active" in o)) o.active = null;
  for(const v of Object.values(o.sessions)) if(v && v.missed) v.missed = v.missed.map(m => Array.isArray(m) ? m : [v.set, m]);
  if(!o.daily) o.daily = {};
  const D = o.daily;
  if(!D.goal) D.goal = 15; if(!("auto" in D)) D.auto = false; if(!("exam" in D)) D.exam = null;
  if(!D.plans) D.plans = {}; if(!D.log) D.log = {};
  if(!o.vq) o.vq = {r:{}, s:null};
  return o;
}
function readLocal(){ try{ const r = localStorage.getItem(LSKEY); if(r){ const o = JSON.parse(r); if(o && o.v===1) return migrate(o); } }catch(e){} return null; }
st = readLocal() || blank();
let ui = {view:"home", set:null, filter:"all", confirmReset:false, calMonth:null, selDay:null, planOpen:false};
const sess = () => (st.active && st.sessions[st.active]) || null;
const openList = s => Object.entries(st.sessions).filter(([k,v]) => v && !v.done && (s ? v.set===s : true));
const FNAME = {all:"전체", d1:"Day 1", d2:"Day 2", d3:"Day 3", d4:"Day 4", d5:"Day 5", d6:"Day 6", wrong:"오답만", missed:"틀린 단어", daily:"새 단어 + 복습"};
const daysOf = s => [...new Set(DATA[s].words.map(w=>w.day))].sort((a,b)=>a-b);

/* ---------- 저장 ---------- */
let writing = false, pending = false, timer = null;
function save(){
  st.updatedAt = Date.now();
  try{ localStorage.setItem(LSKEY, JSON.stringify(st)); }catch(e){}
  if(dbRef){ clearTimeout(timer); timer = setTimeout(flush, 1200); }
}
async function flush(){
  if(!dbRef) return;
  if(writing){ pending = true; return; }
  writing = true;
  try{ await dbRef.set({state: JSON.parse(JSON.stringify(st)), updatedAt: st.updatedAt}); sync = "cloud"; }
  catch(e){ if(e && e.code==="invalid_argument"){ dbRef = null; sync = "local"; } }
  writing = false; paintSync();
  if(pending){ pending = false; flush(); }
}
async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!user || !db) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/" + id + "/wordcards");
    const snap = await ref.get();
    dbRef = ref; sync = "cloud";
    if(snap.exists){
      const r = snap.data();
      if(r && r.state && (r.updatedAt||0) > (st.updatedAt||0)){
        st = migrate(JSON.parse(JSON.stringify(r.state)));
        try{ localStorage.setItem(LSKEY, JSON.stringify(st)); }catch(e){}
        if(ui.view==="study") ui.view = ui.set ? "set" : "home";
        if(ui.view==="vqstudy") ui.view = "vq";
        render();
      }else if((st.updatedAt||0) > (r.updatedAt||0)){ flush(); }
    }else if(st.updatedAt){ flush(); }
    paintSync();
  }catch(e){ dbRef = null; sync = "local"; paintSync(); }
}
function paintSync(){ const el = document.getElementById("sync"); if(el) el.innerHTML = syncHtml(); }
function syncHtml(){ return sync==="cloud" ? '<span class="dot cloud"></span>내 계정에 저장 중' : '<span class="dot"></span>이 기기에 저장 중'; }

/* ---------- 단어 기록 + 간격 반복 + 날짜 기록 ---------- */
const K = (s,i) => s + "|" + DATA[s].words[i].w;
const rec = (s,i) => st.words[K(s,i)] || {w:0, s:0, k:0, a:0};
const seenOf = r => r && (r.seen || (r.t ? dstr(new Date(r.t)) : null));
function dayLog(t){ const L = st.daily.log; return L[t] || (L[t] = {ok:0, ng:0, done:false, missed:[]}); }
function mark(s, i, ok){
  const t = today();
  const r = Object.assign({w:0,s:0,k:0,a:0}, st.words[K(s,i)]);
  if(ok){ r.s += 1; r.k = 1; if(r.s >= 2) r.a = 0; }
  else { r.w += 1; r.s = 0; r.k = 0; r.a = 1; }
  if(!r.seen) r.seen = seenOf(r) || t;
  if(ok){ if(r.ld !== t){ r.lv = Math.min((r.lv||0) + 1, INT.length-1); r.due = addDays(t, INT[r.lv]); } else if(!r.due) r.due = addDays(t, 1); }
  else { r.lv = 0; r.due = addDays(t, 1); }
  r.ld = t; r.t = Date.now();
  st.words[K(s,i)] = r;
  const L = dayLog(t);
  if(ok) L.ok++; else { L.ng++; const k = s + ":" + i; if(!L.missed.includes(k) && L.missed.length < 80) L.missed.push(k); }
}
function counts(s){
  const ws = DATA[s].words; let k=0, x=0;
  ws.forEach((_,i)=>{ const r = rec(s,i); if(r.a) x++; else if(r.k) k++; });
  return {total: ws.length, known: k, wrong: x};
}
function pool(s, f){
  const ws = DATA[s].words; const out = [];
  ws.forEach((w,i)=>{
    if(f==="all" || (f[0]==="d"&&w.day===+f.slice(1)) || (f==="wrong"&&rec(s,i).a)) out.push(i);
  });
  return out;
}

/* ---------- 오늘의 학습 계획 ---------- */
function examLeft(){ const ex = st.daily.exam; return ex ? diffDays(today(), ex) : null; }
function unseenRefs(){ const out = []; for(const s of ORDER) DATA[s].words.forEach((w,i)=>{ if(!seenOf(st.words[K(s,i)])) out.push([s,i]); }); return out; }
function dueRefs(){
  const t = today(), out = [];
  for(const s of ORDER) DATA[s].words.forEach((w,i)=>{
    const r = st.words[K(s,i)];
    if(seenOf(r)){ const due = r.due || t; if(due <= t) out.push({ref:[s,i], a: r.a ? 0 : 1, due}); }
  });
  out.sort((x,y)=> x.a - y.a || (x.due < y.due ? -1 : x.due > y.due ? 1 : 0));
  return out.slice(0, 30).map(x => x.ref);
}
function recGoal(){ const left = examLeft(); if(left===null || left <= 3) return null; return Math.min(40, Math.max(5, Math.ceil(unseenRefs().length / (left - 3)))); }
function goalNow(){ if(st.daily.auto){ const g = recGoal(); if(g) return g; } return st.daily.goal || 15; }
const finalDays = () => { const l = examLeft(); return l !== null && l >= 0 && l <= 3; };
function plan(){
  const t = today(); let p = st.daily.plans[t];
  if(!p){
    p = {nw: finalDays() ? [] : unseenRefs().slice(0, goalNow()), rv: dueRefs(), started:false, done:false};
    st.daily.plans[t] = p;
    const keys = Object.keys(st.daily.plans).sort(); while(keys.length > 14) delete st.daily.plans[keys.shift()];
    save();
  }
  return p;
}
function replan(){ const t = today(), p = st.daily.plans[t]; if(p && !p.started){ delete st.daily.plans[t]; plan(); } }
function startDaily(){
  const t = today(), p = plan(); const seed = Math.floor(Math.random()*1e9);
  const q = [], types = [];
  p.nw.forEach(r => { q.push(r); types.push("flip"); });
  shuffle([...p.nw, ...p.rv], rng(seed)).forEach(r => { q.push(r); types.push("recall"); });
  const sp = p.nw.length ? p.nw : p.rv.filter(([s,i]) => rec(s,i).a);
  shuffle(sp, rng(seed+1)).forEach(r => { q.push(r); types.push("spell"); });
  if(!q.length) return;
  const key = "daily|" + t;
  st.sessions[key] = {set:null, mode:"daily", date:t, filter:"daily", seed, q, types, i:0, ok:0, ng:0, missed:[], ans:null, done:false, t:Date.now(), nn:p.nw.length};
  p.started = true; st.active = key; save(); ui.view = "study"; ui.flipped = false; render(); window.scrollTo(0,0);
}
function streak(){ const L = st.daily.log; let t = today(), n = 0; if(!(L[t] && L[t].done)) t = addDays(t, -1); while(L[t] && L[t].done){ n++; t = addDays(t, -1); } return n; }

/* ---------- 유틸 ---------- */
function rng(seed){ let x = seed>>>0 || 1; return ()=>{ x ^= x<<13; x>>>=0; x ^= x>>17; x ^= x<<5; x>>>=0; return x/4294967296; }; }
function shuffle(a, r){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]+$/,"").replace(/\s+/g," ").trim();
function blankEx(w){
  const base = w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const tries = [new RegExp("\\b"+base+"(s|es|ed|d|ing)?\\b","i")];
  if(/e$/.test(w.w)) tries.push(new RegExp("\\b"+base.slice(0,-1)+"(ing|ed)\\b","i"));
  if(/y$/.test(w.w)) tries.push(new RegExp("\\b"+base.slice(0,-1)+"(ied|ies)\\b","i"));
  for(const re of tries){ if(re.test(w.e)) return esc(w.e).replace(new RegExp(re.source,"i"), '<span class="blank">&nbsp;</span>'); }
  return null;
}

function start(mode, filter){
  const s = ui.set; const p = pool(s, filter);
  if(!p.length) return;
  const seed = Math.floor(Math.random()*1e9);
  let q = shuffle(p, rng(seed));
  let types = null;
  if(mode==="test"){ q = q.slice(0, Math.min(20, q.length)); const r = rng(seed+7); types = q.map(()=>["recall","reverse","spell"][Math.floor(r()*3)]); }
  const key = s + "|" + mode;
  st.sessions[key] = {set:s, mode, filter, seed, q, types, i:0, ok:0, ng:0, missed:[], ans:null, done:false, t:Date.now()};
  st.active = key;
  save(); ui.view = "study"; render();
}

function startMixed(refs, mode){
  if(!refs.length) return;
  const seed = Math.floor(Math.random()*1e9);
  const key = "mix|" + mode;
  st.sessions[key] = {set:null, mode, filter:"missed", seed, q: shuffle(refs, rng(seed)), types:null, i:0, ok:0, ng:0, missed:[], ans:null, done:false, t:Date.now()};
  st.active = key; save(); ui.view = "study"; ui.flipped = false; render(); window.scrollTo(0,0);
}
function cur(){ const ss = sess(); const e = ss.q[ss.i]; const [s,i] = Array.isArray(e) ? e : [ss.set, e]; return {ss, s, i, type: ss.types ? ss.types[ss.i] : ss.mode}; }
function addMissed(ss, s, i){ if(!ss.missed.some(m => m[0]===s && m[1]===i)) ss.missed.push([s,i]); }
function answer(ok, picked){
  const {ss, s, i} = cur();
  if(ss.ans) return;
  mark(s, i, ok);
  if(ok) ss.ok++; else { ss.ng++; addMissed(ss, s, i); }
  ss.ans = {ok, picked: picked===undefined ? null : picked};
  save(); render();
}
function next(){
  const ss = sess(); ss.i++; ss.ans = null; ss.t = Date.now();
  if(ss.i >= ss.q.length){
    ss.done = true;
    if(ss.mode==="daily"){ const p = st.daily.plans[ss.date]; if(p) p.done = true; dayLog(ss.date).done = true; }
  }
  save(); render();
}
function options(type){
  const {ss, s, i} = cur(); const ws = DATA[s].words;
  const r = rng(ss.seed + i*31 + ss.i*7 + 3);
  const field = type==="reverse" ? "w" : "m";
  const seen = new Set([ws[i][field]]); const others = [];
  for(const j of shuffle(ws.map((_,k)=>k), r)){ if(j===i) continue; const v = ws[j][field]; if(seen.has(v)) continue; seen.add(v); others.push(j); if(others.length===3) break; }
  return shuffle([i, ...others], r);
}

    <circle cx="32" cy="32" r="${r}" class="rk" stroke-dasharray="${(k*L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 32 32)"/>
    <circle cx="32" cy="32" r="${r}" class="rx" stroke-dasharray="${(x*L).toFixed(1)} ${L.toFixed(1)}" stroke-dashoffset="${(-k*L).toFixed(1)}" transform="rotate(-90 32 32)"/>

}

function resumeBox(s, skipDaily){

function viewDone(ss){

function render(){

backward … sleeping … destroyed"], "a": 0, "e": "상아가 길어서 뒤로(backward) 올라감. 나무에 기대 누워 있어 자는(sleeping) 것처럼 보임. 박물관에 전시되므로 보존(preserved).", "id": "v16"}, {"set": "ahmed", "t": "문맥 어휘", "q": "밑줄 친 ⓐ~ⓔ 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?", "p": "After he was first spotted by some ⓐ<u>hikers</u>, he became known as the “King of Marsabit.” … They weighed 68 kg each, which made them the ⓑ<u>heaviest</u> elephant tusks ever recorded in Africa. His tusks were so ⓒ<u>long</u> that the only way he could climb hills was by walking up them ⓓ<u>backward</u>. The story of this extraordinary elephant eventually ⓔ<u>lost</u> the attention of the public, and he became the subject of numerous television shows.", "o": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "a": 4, "e": "TV 프로그램의 소재가 되었으므로 관심을 ‘끌었다’ → lost를 caught로 고쳐야 합니다.", "id": "v17"}, {"set": "ahmed", "t": "문맥 어휘", "q": "밑줄 친 ⓐ~ⓔ 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?", "p": "This was primarily because of his ⓐ<u>enormous</u> tusks. … The story of this ⓑ<u>extraordinary</u> elephant eventually caught the attention of the public. Ahmed’s ⓒ<u>reputation</u> made him the first elephant in history to be protected by order of the president of Kenya. Due to his ⓓ<u>shrinking</u> fame, Ahmed was watched over at all times. … One morning, however, Ahmed was found lying ⓔ<u>peacefully</u> against a tree.", "o": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "a": 3, "e": "명성이 높아져 항상 보호받은 것 → shrinking(줄어드는)을 growing으로 고쳐야 합니다.", "id": "v18"}, {"set": "ahmed", "t": "다의어", "q": "밑줄 친 단어와 같은 의미로 쓰인 것은?", "p": "After he was first <u>spotted</u> by some hikers, he became known as the “King of Marsabit.”", "o": ["There is a red spot on my shirt.", "This is a good spot for a picnic.", "He has a small spot on his face.", "We stood on the same spot for an hour.", "I spotted my friend in the crowd."], "a": 4, "e": "여기서 spot은 동사 ‘발견하다’. 얼룩·점(셔츠, 얼굴)이나 장소(소풍 장소, 같은 자리)의 뜻이 아닙니다.", "id": "v19"}, {"set": "ahmed", "t": "다의어", "q": "밑줄 친 단어와 같은 의미로 쓰인 것은?", "p": "He became the <u>subject</u> of nu  "reduce(줄이다) ↔ increase(늘리다). 나머지는 모두 ‘줄이다’ 뜻입니다.", "id": "v31"}, {"set": "mongoose", "t": "유의어·반의어", "q": "밑줄 친 단어와 의미가 가장 가까운 것은?", "p": "Alien species are <u>harming</u> the environment and causing problems.", "o": ["helping", "damaging", "saving", "growing", "carrying"], "a": 1, "e": "harm = damage(해를 끼치다). 반의어는 help입니다.", "id": "v32"}, {"set": "mongoose", "t": "유의어·반의어", "q": "밑줄 친 단어와 의미가 가장 가까운 것은?", "p": "Today they are a major <u>threat</u> to bird life on the islands.", "o": ["danger", "chance", "gift", "rule", "habit"], "a": 0, "e": "threat = danger(위협).", "id": "v33"}, {"set": "mongoose", "t": "유의어·반의어", "q": "밑줄 친 단어와 뜻이 <u>반대</u>인 것은?", "p": "Many of these species are now at risk of <u>extinction</u>.", "o": ["disappearance", "damage", "threat", "survival", "harm"], "a": 3, "e": "extinction(멸종) ↔ survival(생존). disappearance(사라짐)는 비슷한 말입니다.", "id": "v34"}, {"set": "mongoose", "t": "문맥 어휘", "q": "(A), (B), (C)에 들어갈 말로 문맥상 가장 적절한 것은?", "p": "An alien species is a species of plant or animal that has moved from its (A)[original / final] habitat to a new area. … It has greatly (B)[increased / reduced] the numbers of many native bird species. Many of these species are now at (C)[risk / hope] of extinction.", "o": ["original … reduced … risk", "final … reduced … hope", "original … increased … risk", "final … increased … hope", "original … reduced … hope"], "a": 0, "e": "원래의(original) 서식지에서 옮겨 옴. 알을 먹으니 토종 새의 수를 줄임(reduced). at risk of extinction(멸종 위기).", "id": "v35"}, {"set": "mongoose", "t": "문맥 어휘", "q": "(A), (B), (C)에 들어갈 말로 문맥상 가장 적절한 것은?", "p": "It was brought to Hawaii in the 1800s to (A)[kill / protect] rats in sugarcane fields. Since then, they have (B)[grown / shrunk] in numbers so that today they are a major threat to bird life on the islands. … Many of these species, which are (C)[unique / common] to the islands, are now at risk of extinction.", "o": ["kill … grown … unique", "protect … grown … unique", "kill … shrunk … common", "protect … shrunk … unique", "kill … grown … common"], "a": 0, "e": "쥐를 없애려고(kill) 데려옴. 수가 늘어(grown) 위협이 됨. 그 섬들에만 있는(unique) 종이라 멸종 위기.", "id": "v36"}, {"set": "mongoose", "t": "문맥 어휘", "q": "밑줄 친 ⓐ~ⓔ 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?", "p": "In many parts of the world, alien species are ⓐ<u>harming</u> the environment. … It was brought to Hawaii in the 1800s to ⓑ<u>kill</u> rats in sugarcane fields. Since then, they have grown in numbers so that today they are a major ⓒ<u>threat</u> to bird life on the islands. … As a result, the mongoose has caused millions of dollars worth of ⓓ<u>profit</u> to poultry farmers in Hawaii, and it has greatly ⓔ<u>reduced</u> the numbers of many native bird species.", "o": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "a": 3, "e": "농가가 입은 것은 이익이 아니라 피해 → profit을 damage로 고쳐야 합니다.", "id": "v37"}, {"set": "mongoose", "t": "문맥 어휘", "q": "밑줄 친 ⓐ~ⓔ 중, 문맥상 낱말의 쓰임이 적절하지 <u>않은</u> 것은?", "p": "An alien species has moved from its ⓐ<u>original</u> habitat to a new area. … Today mongooses are a major ⓑ<u>threat</u> to bird life on the islands. One of their ⓒ<u>favorite</u> foods is birds’ eggs. As a result, the mongoose has caused millions of dollars worth of ⓓ<u>damage</u> to poultry farmers in Hawaii, and it has greatly ⓔ<u>increased</u> the numbers of many native bird species.", "o": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "a": 4, "e": "새의 알을 먹으니 토종 조류의 수는 줄어듭니다 → increased를 reduced로. (지문을 요약·변형한 글)", "id": "v38"}, {"set": "mongoose", "t": "다의어", "q": "밑줄 친 단어와 같은 의미로 쓰인 것은?", "p": "The mongoose mostly <u>feeds</u> on insects, crabs, and earthworms.", "o": ["Please feed the cat twice a day.", "Cows feed on grass in the field.", "The river feeds the big lake.", "He checks his news feed every morning.", "We need to feed the fire with more wood."], "a": 1, "e": "feed on = ~을 먹고 살다. 먹이를 주다, (강이) 흘러들다, 뉴스 피드, (불에) 넣다가 아닙니다.", "id": "v39"}, {"set": "mongoose", "t": "다의어", "q": "밑줄 친 단어와 같은 의미로 쓰인 것은?", "p": "In many parts of the world, <u>alien</u> species are harming the environment.", "o": ["The const VQT = ["영영 풀이","유의어·반의어","문맥 어휘","다의어"];
const VQS = {all:"전체 지문", ahmed:"Ahmed", mongoose:"Mongoose"};
const vqd = () => (st.vq || (st.vq = {r:{}, s:null}));
const vqr = id => vqd().r[id] || {w:0, k:0, a:0};
function vqPool(){
  const f = ui.vq || (ui.vq = {set:"all", t:"all", wrong:false});
  return VQ.filter(q => (f.set==="all"||q.set===f.set) && (f.t==="all"||q.t===f.t) && (!f.wrong || vqr(q.id).a));
}
function vqStart(ids){
  if(!ids.length) return;
  const seed = Math.floor(Math.random()*1e9);
  vqd().s = {q: shuffle(ids, rng(seed)), seed, i:0, ok:0, ng:0, missed:[], ans:null, done:false};
  save(); ui.view = "vqstudy"; render(); window.scrollTo(0,0);
}
const vqFixed = q => /^[ⓐ①]/.test(q.o[0]) && q.o.every(o=>o.length<=2 || /^[ⓐ-ⓔ] :/.test(o));
function vqOrder(q, ss){ return vqFixed(q) ? [0,1,2,3,4] : shuffle([0,1,2,3,4], rng(ss.seed + ss.i*13 + 5)); }
function vqAnswer(pick){
  const ss = vqd().s; if(!ss || ss.ans) return;
  const q = VQ.find(x=>x.id===ss.q[ss.i]); const ok = pick===q.a;
  const r = Object.assign({w:0,k:0,a:0}, vqd().r[q.id]);
  if(ok){ r.k = 1; r.a = 0; ss.ok++; } else { r.w++; r.k = 0; r.a = 1; ss.ng++; if(!ss.missed.includes(q.id)) ss.missed.push(q.id); }
  r.t = Date.now(); vqd().r[q.id] = r;
  const L = dayLog(today()); if(ok) L.ok++; else L.ng++;
  ss.ans = {pick, ok}; save(); render();
}
function vqCounts(list){ let k=0, x=0; for(const q of list){ const r = vqr(q.id); if(r.a) x++; else if(r.k) k++; } return {k, x, n:list.length}; }
function vqHomeCard(){
  const c = vqCounts(VQ);
  return `<div class="shelf">어휘 문제로 연습하기</div>
  <button class="card vqopen" type="button" data-act="vq"><span class="ic" aria-hidden="true">Q</span>
    <div class="sbody"><div class="nm">어휘 문제 ${VQ.length}문항</div><div class="sub">영영 풀이 · 유의어·반의어 · 문맥 어휘 · 다의어</div>
    <div class="stats"><span>맞힌 문제 <b>${c.k}</b></span><span>틀린 문제 <b>${c.x}</b></span></div></div><span class="go" aria-hidden="true">›</span></button>`;
}
function viewVQ(){
  const f = ui.vq || (ui.vq = {set:"all", t:"all", wrong:false});
  const c = vqCounts(VQ);
  let h = header("어휘 문제", `${VQ.length}문항 · 맞힌 문제 ${c.k} · 틀린 문제 ${c.x}`, "home");
  const ss = vqd().s;
  if(ss && !ss.done) h += `<div class="resume"><div><b>이어서 풀기</b><div class="sub">${ss.i}/${ss.q.length} 완료 · ○ ${ss.ok} ✕ ${ss.ng}</div></div><button class="btn" type="button" data-act="vqresume">이어서</button></div>`;
  const chip = (grp,k,l,n) => `<button class="chip" type="button" aria-pressed="${f[grp]===k}" data-act="vqf" data-g="${grp}" data-k="${k}">${l}${n!==undefined?`<span class="n">${n}</span>`:""}</button>`;
  h += `<div><div class="sub" style="margin-bottom:6px">지문</div><div class="chips">${Object.entries(VQS).map(([k,l])=>chip("set",k,l,k==="all"?VQ.length:VQ.filter(q=>q.set===k).length)).join("")}</div></div>`;
  h += `<div><div class="sub" style="margin-bottom:6px">유형</div><div class="chips">${chip("t","all","전체")}${VQT.map(t=>chip("t",t,t,VQ.filter(q=>q.t===t&&(f.set==="all"||q.set===f.set)).length)).join("")}</div></div>`;
  h += `<div class="chips"><button class="chip" type="button" aria-pressed="${f.wrong}" data-act="vqwrong">틀린 문제만<span class="n">${VQ.filter(q=>vqr(q.id).a).length}</span></button></div>`;
  const p = vqPool();
  h += `<button class="btn big" type="button" data-act="vqgo" ${p.length?"":"disabled"}>${p.length}문제 풀기</button>`;
  if(!p.length && f.wrong) h += `<div class="note">틀린 문제가 없어요. 다른 범위를 골라 풀어 보세요.</div>`;
  const wrong = VQ.filter(q=>vqr(q.id).a);
  h += `<div class="card"><div style="padding:12px 14px 6px"><h2>틀린 어휘 문제</h2></div>`;
  h += wrong.length ? `<div class="list">${wrong.map(q=>`<div class="li"><span><span class="tchip">${q.t}</span> ${esc(VQS[q.set])} · ${q.p.replace(/<[^>]+>/g,"").slice(0,38)}…</span><span class="c">틀린 횟수 ${vqr(q.id).w}</span></div>`).join("")}</div>` : `<div class="li sub">아직 틀린 문제가 없어요.</div>`;
  h += `</div>`;
  h += ui.vqReset
    ? `<div class="confirm">어휘 문제 기록(맞힌 문제, 틀린 문제)을 모두 지울까요? <button class="btn bad" type="button" data-act="vqresetyes" style="padding:6px 12px">지우기</button><button class="btn ghost" type="button" data-act="vqresetno" style="padding:6px 12px">취소</button></div>`
    : `<button class="danger" type="button" data-act="vqreset">어휘 문제 기록 처음부터 다시</button>`;
  return h;
}
function viewVQStudy(){
  const ss = vqd().s;
  let h = header("어휘 문제", "", "vq");
  if(ss.done){
    const tot = ss.ok + ss.ng;
    h += `<div class="card idx" style="padding:16px 18px;display:flex;flex-direction:column;gap:6px"><div class="tag"><span>끝!</span><span>어휘 문제</span></div>
      <div class="score" style="margin-top:22px">${Math.round(ss.ok/Math.max(1,tot)*100)}점</div><div class="sub">맞힌 문제 ${ss.ok} · 틀린 문제 ${ss.ng}</div></div>`;
    if(ss.missed.length) h += `<button class="btn" type="button" data-act="vqretry">틀린 문제만 다시 풀기 (${ss.missed.length})</button>`;
    h += `<button class="btn ghost" type="button" data-act="vq">어휘 문제로 돌아가기</button>`;
    return h;
  }
  const q = VQ.find(x=>x.id===ss.q[ss.i]); const a = ss.ans; const ord = vqOrder(q, ss);
  h += `<div class="prog"><span>${ss.i+1} / ${ss.q.length}</span><div class="bar"><i style="width:${ss.i/ss.q.length*100}%"></i></div><span style="color:var(--good)">○ ${ss.ok}</span><span style="color:var(--bad)">✕ ${ss.ng}</span></div>`;
  h += `<div class="card q"><div class="tag"><span><span class="tchip">${q.t}</span> ${esc(VQS[q.set])}</span></div><div class="qtxt">${q.q}</div>${q.p?`<div class="pbox">${q.p}</div>`:""}
    <div class="opts">${ord.map((k,n)=>{ let cls = "opt"; if(a){ if(k===q.a) cls += " right"; else if(a.pick===k) cls += " wrongpick"; }
      return `<button class="${cls}" type="button" data-act="vqpick" data-k="${k}" ${a?"disabled":""}><span class="no">${"①②③④⑤"[n]}</span><span class="tx">${q.o[k]}</span></button>`; }).join("")}</div>
    ${a?`<div class="fb ${a.ok?"ok":"no"}">${a.ok?"정답!":`정답은 ${"①②③④⑤"[ord.indexOf(q.a)]}번 · 틀린 문제에 넣었어요`}</div><div class="exp">${q.e}</div>`:""}</div>`;
  if(a) h += `<button class="btn" type="button" data-act="vqnext">${ss.i+1>=ss.q.length?"결과 보기":"다음"}</button>`;
  return h;
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act, f = ui.vq || (ui.vq = {set:"all", t:"all", wrong:false});
  if(act==="vq"){ ui.view = "vq"; ui.vqReset = false; render(); window.scrollTo(0,0); }
  else if(act==="vqf"){ f[b.dataset.g] = b.dataset.k; render(); }
  else if(act==="vqwrong"){ f.wrong = !f.wrong; render(); }
  else if(act==="vqgo"){ vqStart(vqPool().map(q=>q.id)); }
  else if(act==="vqresume"){ ui.view = "vqstudy"; render(); window.scrollTo(0,0); }
  else if(act==="vqpick"){ vqAnswer(+b.dataset.k); }
  else if(act==="vqnext"){ const ss = vqd().s; ss.i++; ss.ans = null; if(ss.i>=ss.q.length) ss.done = true; save(); render(); window.scrollTo(0,0); }
  else if(act==="vqretry"){ vqStart(vqd().s.missed.slice()); }
  else if(act==="vqreset"){ ui.vqReset = true; render(); }
  else if(act==="vqresetno"){ ui.vqReset = false; render(); }
  else if(act==="vqresetyes"){ st.vq = {r:{}, s:null}; ui.vqReset = false; save(); render(); }
});

/* ---------- 입력 ---------- */
document.addEventListener("click", e=>{
  const sp = e.target.closest("[data-speak]");
  if(sp){ e.stopPropagation(); speak(sp.dataset.speak); return; }
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act==="open"){ ui.set = b.dataset.set; ui.view = "set"; ui.filter = "all"; ui.confirmReset=false; render(); window.scrollTo(0,0); }
  else if(act==="home"){ ui.view = "home"; render(); window.scrollTo(0,0); }
  else if(act==="set"){ ui.view = ui.set ? "set" : "home"; ui.confirmReset=false; render(); window.scrollTo(0,0); }
  else if(act==="resume"){ const k = b.dataset.key; if(!st.sessions[k]) return; st.active = k; if(st.sessions[k].set) ui.set = st.sessions[k].set; ui.view = "study"; ui.flipped = false; render(); window.scrollTo(0,0); }
  else if(act==="daily"){ startDaily(); }
  else if(act==="dropask"){ ui.dropKey = b.dataset.key; render(); }
  else if(act==="dropno"){ ui.dropKey = null; render(); }
  else if(act==="dropyes"){
    const k = b.dataset.key, o = st.sessions[k];
    if(o && o.mode==="daily"){ const p = st.daily.plans[o.date]; if(p && !p.done) p.started = false; }
    delete st.sessions[k]; if(st.active===k) st.active = null; ui.dropKey = null; save(); render();
  }
  else if(act==="dailymore"){ const p = plan(); startMixed([...p.nw, ...p.rv], "recall"); }
  else if(act==="mon"){ const base = ui.calMonth || today().slice(0,7); const [y,m] = base.split("-").map(Number); const d = new Date(y, m-1+(+b.dataset.n), 1); ui.calMonth = d.getFullYear()+"-"+pad(d.getMonth()+1); render(); }
  else if(act==="day"){ ui.selDay = ui.selDay===b.dataset.d ? null : b.dataset.d; render(); }
  else if(act==="daymiss"){ const l = st.daily.log[ui.selDay]; if(!l) return; startMixed((l.missed||[]).map(x=>{const [s,i]=x.split(":");return [s,+i];}).filter(([s,i])=>DATA[s]&&DATA[s].words[i]), "recall"); }
  else if(act==="goal"){ st.daily.goal = +b.dataset.g; st.daily.auto = false; ui.planOpen = true; replan(); save(); render(); }
  else if(act==="auto"){ st.daily.auto = true; ui.planOpen = true; replan(); save(); render(); }
  else if(act==="filter"){ ui.filter = b.dataset.f; render(); }
  else if(act==="start"){ ui.flipped=false; start(b.dataset.mode, ui.filter); }
  else if(act==="wrongstart"){ ui.filter="wrong"; ui.flipped=false; start("recall","wrong"); }
  else if(act==="flipcard"){ ui.flipped = !ui.flipped; render(); }
  else if(act==="know"){ const ok = b.dataset.ok==="1"; const {ss,s,i} = cur(); mark(s,i,ok); if(ok) ss.ok++; else { ss.ng++; addMissed(ss,s,i); } ui.flipped=false; next(); }
  else if(act==="pick"){ const j = +b.dataset.j; answer(j===cur().i, j); }
  else if(act==="check"){ checkSpell(); }
  else if(act==="giveup"){ answer(false, ""); }
  else if(act==="next"){ ui.flipped=false; next(); window.scrollTo(0,0); }
  else if(act==="retrymissed"){
    const ss = sess(); const mode = (ss.mode==="test" || ss.mode==="daily") ? "recall" : ss.mode;
    if(ss.set){ const s = ss.set; const seed = Math.floor(Math.random()*1e9); const key = s+"|"+mode;
      st.sessions[key] = {set:s, mode, filter:"missed", seed, q: shuffle(ss.missed.map(m=>m[1]), rng(seed)), types:null, i:0, ok:0, ng:0, missed:[], ans:null, done:false, t:Date.now()};
      st.active = key; save(); render(); }
    else startMixed(ss.missed.slice(), mode);
  }
  else if(act==="again"){ const ss = sess(); ui.set = ss.set; start(ss.mode, ss.filter==="missed" ? "all" : ss.filter); }
  else if(act==="reset"){ ui.confirmReset = true; render(); }
  else if(act==="resetno"){ ui.confirmReset = false; render(); }
  else if(act==="resetyes"){ const s = ui.set; for(const k of Object.keys(st.words)) if(k.startsWith(s+"|")) delete st.words[k]; for(const k of Object.keys(st.sessions)) if(k.startsWith(s+"|")) delete st.sessions[k]; st.active = null; ui.confirmReset=false; replan(); save(); render(); }
});
document.addEventListener("toggle", e=>{ if(e.target.classList && e.target.classList.contains("plan")) ui.planOpen = e.target.open; }, true);
document.addEventListener("change", e=>{
  if(e.target.id==="examdate"){ st.daily.exam = e.target.value || null; if(!st.daily.exam) st.daily.auto = false; ui.planOpen = true; replan(); save(); render(); }
});
document.addEventListener("keydown", e=>{
  const t = e.target.closest && e.target.closest('[data-act="flipcard"]');
  if(t && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); ui.flipped=!ui.flipped; render(); }
});
document.addEventListener("submit", e=>{ if(e.target.id==="spellform"){ e.preventDefault(); checkSpell(); } });
function checkSpell(){
  const el = document.getElementById("spell"); if(!el) return;
  const v = el.value; if(!v.trim()) { el.focus(); return; }
  const {s,i} = cur(); answer(norm(v)===norm(DATA[s].words[i].w), v);
}
/* 자정이 지나 다시 열면 새 날 계획으로 */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ui.view==="home") render(); });

render();
initDb();
</script>
