<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA v147 · 오늘의 학습 2 Day · 완료 분리 · 이탈 시간</title>
<style>
html,body{margin:0;background:#0f172a;font-family:system-ui,-apple-system,sans-serif}
#bar{color:#e2e8f0;font:11px/1.45 ui-monospace,monospace;padding:6px 10px;white-space:pre-wrap;min-height:44px}
iframe{display:block;width:390px;height:844px;border:0;margin:0 auto;background:#fff}
</style></head>
<body>
<div id="bar">QA v147 · 로딩 중…</div>
<iframe id="f" src="index.html?qa147=1"></iframe>
<script>
var F = document.getElementById('f'), BAR = document.getElementById('bar');
var LOG = [];
function say(t) { LOG.push(t); BAR.textContent = 'QA v147\n' + LOG.slice(-6).join('\n'); }
window.__qa = { log: LOG, blocked: [], w: null };

F.addEventListener('load', function () {
  var w = F.contentWindow, blocked = window.__qa.blocked;
  window.__qa.w = w;
  /* ── 외부 쓰기·푸시 전면 차단(학생 DB·시트·ntfy·MQTT·FCM) ── */
  function stub(n) { try { w[n] = function () { blocked.push(n); }; } catch (e) {} }
  /* ssNtfy는 실제 경로로 돌려 SS.lastPush(알림 문구)를 확인하고, 전송만 막는다 */
  ['dbSaveAsync', 'ssStatusPub', 'ssBoardPush', 'ssBoardEvent',
   'ssNetPub', 'ssSessionSub', 'ssFullscreen', 'ssExitFullscreen', 'ssWake', 'ssHistPush',
   'sendDirectorPushNotification', 'pushStreakBoard', 'pullMyTeacherNote', 'hpSubscribe',
   'syncSwState', 'startReminderLoop', 'triggerAiPraiseReply', 'playFanfareSound'].forEach(stub);
  try { w.fetch = function (u) { blocked.push('fetch:' + u); return Promise.reject(new Error('qa147-blocked')); }; } catch (e) {}
  try {
    w.call = function (m, cred, name) {
      blocked.push('call:' + m);
      if (m === 'getWordSet') {
        var sd = w.ALL_WORD_SETS[name] || null;
        var list = sd ? (Array.isArray(sd) ? sd : (sd.words || [])) : [];
        return Promise.resolve(list.map(function (x) { return { w: x.w, m: x.m, e: x.e }; }));
      }
      return Promise.resolve([]);
    };
  } catch (e) {}
  say('준비 · 앱버전 ' + (w.TOPEDU_APP_VERSION || '?'));
});

/* ── 가짜 단어 세트(능률VOCA 초등필수 Day 01~05 + 다른 반 Day 교재) ── */
window.__qa.seed = function () {
  var w = window.__qa.w, i, d;
  for (d = 1; d <= 5; d++) {
    var words = [];
    for (i = 1; i <= 15; i++) words.push({ w: 'word' + d + '_' + i, m: '뜻' + d + '_' + i });
    w.ALL_WORD_SETS['능률VOCA 초등필수 Day ' + ('0' + d).slice(-2)] = { target: '초5', words: words };
  }
  for (d = 1; d <= 4; d++) {
    var w2 = [];
    for (i = 1; i <= 10; i++) w2.push({ w: 'mid' + d + '_' + i, m: '중등' + d + '_' + i });
    w.ALL_WORD_SETS['능률VOCA 중등필수 Day ' + ('0' + d).slice(-2)] = { target: '수지중2', words: w2 };
  }
  return Object.keys(w.ALL_WORD_SETS).length;
};
/* ── 오늘의 학습 계획 요약(읽기 전용) ── */
window.__qa.plan = function (ban, name) {
  var w = window.__qa.w;
  w.S.cred = { ban: ban || '초5', name: name || 'QA초5', pw: '0000' };
  try { w.dailyPlan(w.S.cred); } catch (e) {}
  var p = null;
  try { p = w.dailyPlan(w.S.cred); } catch (e) { return { err: String(e) }; }
  if (!p) return null;
  return {
    ban: w.S.cred.ban, ch5: !!p.ch5, done: p.done, label: p.label,
    doneDays: p.doneDays, need: p.needDays, count: p.count, remain: p.remainCount,
    days: (p.days || []).map(function (x) { return w.dayShort(x) + '|' + (x.complete ? 'O' : 'X') + '|' + (x.today ? 'T' : '-') + '|' + x.name; }),
    todaySet: p.todaySet ? p.todaySet.name : null
  };
};
/* ── 세트를 필수 모드까지 끝낸 것으로 기록(학생 폰 저장 DB만, 서버·푸시 없음) ── */
window.__qa.finishSet = function (ban, name, setName) {
  var w = window.__qa.w;
  ['카드', '뜻고르기', '짝맞추기', '테스트'].forEach(function (mode) {
    w.saveStudentProgressDB(ban, name, setName, mode, 100);
  });
  var info = w.getStreakInfo(ban, name);
  return { todayDone: info.todayDone, streak: info.streak };
};
/* ── 오늘의 학습 카드·부엉이 카드·자기주도 카드 실제 렌더 ── */
window.__qa.renderHome = function (ban, name) {
  var w = window.__qa.w;
  ban = ban || '초5'; name = name || 'QA초5';
  w.S.cred = { ban: ban, name: name, pw: '0000' };
  w.S.home = w.buildStudentHome(w.S.cred);
  try { w.showHome(); } catch (e) { return { err: String(e) }; }
  var d = w.document;
  function txt(sel) { var e = d.querySelector(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : null; }
  var go = d.getElementById('streak_go');
  var card = d.querySelector('.card.today');
  var ss = d.getElementById('ss_home_card');
  return {
    ver: w.TOPEDU_APP_VERSION,
    owlBtn: go ? go.textContent.replace(/\s+/g, ' ').trim() : null,
    owlAct: go ? go.getAttribute('data-act') : null,
    owlTag: txt('.sh-tag'),
    owlDayPill: (function () { var n = d.querySelector('.streak-hero .sh-msg'); var p = n ? n.nextElementSibling : null; return p ? p.textContent.replace(/\s+/g, ' ').trim() : null; })(),
    todayCard: card ? card.textContent.replace(/\s+/g, ' ').trim() : null,
    todayBtn: txt('#btn_daily_quest'),
    ssCard: ss ? ss.textContent.replace(/\s+/g, ' ').trim() : null,
    ssBtn: txt('#ss_go'),
    errs: (w.__topeduErrors || []).length
  };
};
/* ── 부엉이 카드 버튼을 직접 눌러 '오늘의 학습'이 열리는지 ── */
window.__qa.clickOwl = function () {
  var w = window.__qa.w, d = w.document;
  var b = d.getElementById('streak_go');
  if (!b) return { err: 'no button' };
  b.click();
  return new Promise(function (res) {
    setTimeout(function () {
      var t = d.querySelector('.topBar, .top, h1');
      res({ after: t ? t.textContent.replace(/\s+/g, ' ').trim() : '(제목 없음)', setOpened: (w.W && w.W.set) ? w.W.set.name : null, ssOn: !!w.SS.on });
    }, 700);
  });
};
/* ── 자기주도: 오늘 상태(완료/이어하기/미시작) + 홈 카드 문구 ── */
window.__qa.ssBadge = function (ban, name) {
  var w = window.__qa.w;
  ban = ban || '초5'; name = name || 'QA초5';
  w.S.cred = { ban: ban, name: name, pw: '0000' };
  var st = w.ssTodayState(ban, name);
  var html = w.ssHomeCard(ban);
  var box = w.document.createElement('div');
  box.innerHTML = html;
  return { state: st, card: box.textContent.replace(/\s+/g, ' ').trim(), btn: (box.querySelector('#ss_go') || {}).textContent };
};
/* ── 자기주도 시작 → 이탈·awaySec 누적 → 완주 → 날짜별 완료 기록 ── */
window.__qa.ssStart = function (ban, name, days) {
  var w = window.__qa.w;
  ban = ban || '초5'; name = name || 'QA초5';
  w.S.cred = { ban: ban, name: name, pw: '0000' };
  w.S.home = w.buildStudentHome(w.S.cred);
  w.ssCfgSave(ban, { goal: 60, dayMode: 'auto', dayBook: '', dayStart: 1, dayCount: days || 2, testCount: 4, sentCount: 4, probCount: 4 });
  w.ssStart();
  return { on: w.SS.on, days: (w.SS.s1.days || []).map(function (d) { return d.name; }), stage: w.SS.stage, awaySec: w.SS.awaySec };
};
window.__qa.ssAway = function (sec) {
  var w = window.__qa.w;
  /* 실제 visibilitychange와 같은 경로: hidden → 나감, 보임 → 돌아옴 */
  w.SS.leaveT = Date.now() - Math.round(sec * 1000);
  w.SS.awayOpen = w.SS.leaveT;
  var before = { away: w.ssAwayNow(), cnt: w.SS.leaveCnt, live: w.ssStatusObj().aw };
  w.ssLeaveEnd();
  var o = w.ssStatusObj();
  return { before: before, after: { away: o.aw, lv: o.lv, ls: o.ls, awl: o.awl }, leaveT: w.SS.leaveT };
};
window.__qa.ssStatusObj = function () { var w = window.__qa.w; return w.ssStatusObj(); };
window.__qa.boardDetail = function (o) { var w = window.__qa.w; return w.ssBoardDetail(o || w.ssStatusObj()); };
window.__qa.ssFinishNow = function (elSec) {
  var w = window.__qa.w;
  if (elSec) w.SS.t0 = Date.now() - Math.round(elSec * 1000);
  w.SS.s3.wrong = []; w.SS.s3.rt = null;
  (w.SS.s1.days || []).forEach(function (d) { d.qwrong = []; });
  w.ssFinish();
  return { done: w.SS.done, doneEl: Math.round(w.SS.doneEl), away: Math.round(w.ssAwayNow()), daylog: w.ssDayLogToday(w.SS.name), ntfy: w.SS.lastPush };
};
window.__qa.board = function (ban) {
  var w = window.__qa.w;
  w.SS_VIEW.ban = ban || '초5';
  var box = w.document.createElement('div');
  box.innerHTML = w.ssBoardHtml();
  return box.textContent.replace(/\s+/g, ' ').trim();
};
window.__qa.reset = function () {
  var w = window.__qa.w;
  try { w.localStorage.removeItem(w.DAY_DONEMAP_KEY); } catch (e) {}
  try { w.localStorage.removeItem('topedu_ss_daylog'); } catch (e) {}
  try { w.ssSnapGet() && w.localStorage.removeItem('topedu_ss97_snap'); } catch (e) {}
  ['QA초5', 'QA중2'].forEach(function (n) {
    try { w.localStorage.removeItem('topedu_prog_초5_' + n); } catch (e) {}
    try { w.localStorage.removeItem('topedu_prog_수지중2_' + n); } catch (e) {}
    try { w.localStorage.removeItem('topedu_streak_초5_' + n); } catch (e) {}
    try { w.localStorage.removeItem('topedu_streak_수지중2_' + n); } catch (e) {}
  });
  return 'reset';
};
</script>
</body></html>
