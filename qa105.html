<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v105 QA · 390x844</title>
<style>
  html,body{margin:0;padding:0;background:#eef2f6;font-family:-apple-system,'Malgun Gothic',sans-serif}
  .row{display:flex;gap:14px;align-items:flex-start;padding:10px}
  .slot{background:#fff;border-radius:14px;box-shadow:0 3px 14px rgba(15,23,42,.18);overflow:hidden;flex:0 0 auto}
  iframe{border:0;display:block;width:390px;height:844px}
  #log{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;max-width:820px;color:#0f172a;
       background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(15,23,42,.12)}
  h3{margin:0 0 6px;font-size:13px;color:#0f766e}
</style>
</head>
<body>
<div class="row">
  <div class="slot"><iframe id="f" src="./index.html?qa105=1"></iframe></div>
  <div id="log">측정 준비 중…</div>
</div>
<script>
var errs = [];
var f = document.getElementById('f');
var logEl = document.getElementById('log');

function render(extra) {
  var t = '';
  t += '<h3>v105 실서버 390×844 검증</h3>';
  t += (extra || '') + '\n';
  t += '콘솔 에러 ' + errs.length + '건' + (errs.length ? (':\n· ' + errs.join('\n· ')) : ' (0건)') + '\n';
  logEl.innerHTML = '<pre style="margin:0;white-space:pre-wrap">' + t.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
  window.__qa = { errs: errs.slice(), extra: extra || '', done: (window.__qa && window.__qa.done) || false };
}

function hook(w) {
  try {
    w.addEventListener('error', function (e) {
      errs.push('error: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      render(window.__qaExtra);
    });
    w.addEventListener('unhandledrejection', function (e) {
      var r = e.reason || {};
      errs.push('rejection: ' + (r.message || r));
      render(window.__qaExtra);
    });
    var ce = w.console.error;
    w.console.error = function () {
      errs.push('console.error: ' + Array.prototype.join.call(arguments, ' '));
      render(window.__qaExtra);
      try { ce.apply(w.console, arguments); } catch (e) {}
    };
  } catch (e) { errs.push('hook 실패: ' + e.message); }
}

var measured = false;
f.addEventListener('load', function () {
  var w = f.contentWindow;
  hook(w);
  if (measured) return;
  measured = true;
  setTimeout(function () { runTests(w); }, 2200);
});

function px(v) { return Math.round(v * 10) / 10; }

function runTests(w) {
  var out = [];
  try {
    /* 1) 반드시 새 코드(v105)로 다시 그려서 그 경로에서 생기는 에러까지 잡는다 */
    if (typeof w.showHome !== 'function') { errs.push('showHome 없음'); }
    w.showHome();

    var d = w.document;
    var ver = w.TOPEDU_APP_VERSION || '(없음)';
    out.push('· 앱 버전: ' + ver);
    out.push('· 로그인 학생: ' + ((w.S && w.S.cred && (w.S.cred.ban + ' · ' + w.S.cred.name)) || '(없음)'));

    var b = d.getElementById('hofBanner');
    out.push('· 배너 존재: ' + (b ? 'YES' : 'NO'));
    if (b) {
      var br = b.getBoundingClientRect();
      var cs = w.getComputedStyle(b);
      out.push('· 배너 크기: ' + px(br.width) + '×' + px(br.height) + ' / 상단 ' + px(br.top + w.scrollY) + 'px');
      out.push('· 가로 넘침: ' + (b.scrollWidth <= b.clientWidth + 1 ? '없음 (' + b.scrollWidth + '≤' + b.clientWidth + ')' : '있음! ' + b.scrollWidth + '>' + b.clientWidth));
      var txt = (b.textContent || '').replace(/\s+/g, ' ').trim();
      out.push('· 문구: ' + txt);
      var need = ['12월 성실왕 명예의 전당', '1/1 발표', '시험 점수보다', '단어 완주', '1등 1만원', '2등 7천원', '3등 5천원', '4등 3천원', '5등 2천원'];
      var miss = need.filter(function (s) { return txt.indexOf(s) < 0; });
      out.push('· 필수 문구 누락: ' + (miss.length ? miss.join(', ') : '없음'));
      /* 배지가 카드 안에 들어가는지 */
      var badge = b.querySelector('span[style*="999px"]');
      if (badge) {
        var bb = badge.getBoundingClientRect();
        out.push('· 배지 우측 끝 ' + px(bb.right) + ' ≤ 카드 우측 ' + px(br.right) + ': ' + (bb.right <= br.right + 0.5 ? 'OK' : '넘침!'));
      }
      /* 줄바꿈/잘림 검사 */
      var clipped = [];
      [].forEach.call(b.querySelectorAll('div,span,b'), function (el) {
        if (el.scrollWidth > el.clientWidth + 1 && w.getComputedStyle(el).overflow !== 'visible') clipped.push(el.textContent.slice(0, 20));
      });
      out.push('· 잘린 요소: ' + (clipped.length ? clipped.join(' / ') : '없음'));
      /* 상품 칩 줄 수 */
      var chipRow = b.querySelector('div[style*="flex-wrap"]');
      if (chipRow) {
        var rows = {};
        [].forEach.call(chipRow.children, function (c) { rows[Math.round(c.getBoundingClientRect().top)] = 1; });
        out.push('· 상품 칩: ' + chipRow.children.length + '개 · ' + Object.keys(rows).length + '줄 · 칩 줄 넘침 ' + (chipRow.scrollWidth <= chipRow.clientWidth + 1 ? '없음' : '있음!'));
      }
    }

    /* 2) 페이지 전체 가로 스크롤 없음 */
    var de = d.documentElement;
    out.push('· 문서 폭: innerWidth ' + w.innerWidth + ' / scrollWidth ' + de.scrollWidth + ' → ' + (de.scrollWidth <= w.innerWidth + 1 ? '가로 스크롤 없음' : '가로 넘침!'));
    out.push('· 뷰포트: ' + w.innerWidth + '×' + w.innerHeight + ' · dpr ' + w.devicePixelRatio);

    /* 3) 배너가 화면(844) 안 상단에 보이는지 */
    if (b) {
      var r2 = b.getBoundingClientRect();
      out.push('· 첫 화면(844px) 안: ' + (r2.top >= 0 && r2.bottom <= 844 ? '완전히 보임 (상단 ' + px(r2.top) + 'px)' : ('일부/아래: top ' + px(r2.top) + ', bottom ' + px(r2.bottom))));
    }

    /* 4) 로그인 화면·선생님 화면에는 안 뜨는지 (상태는 그대로 되돌림) */
    var savedHome = w.S && w.S.home;
    try {
      if (typeof w.showLogin === 'function') {
        w.showLogin();
        out.push('· 로그인 화면 배너: ' + (d.getElementById('hofBanner') ? '뜸!(문제)' : '없음 OK'));
      }
      if (savedHome && w.S) {
        var copy = { sets: savedHome.sets, ban: '선생님', name: savedHome.name, me: { ban: '선생님', name: savedHome.name } };
        w.S.home = copy;
        w.showHome();
        out.push('· 선생님(ban=선생님) 홈 배너: ' + (d.getElementById('hofBanner') ? '뜸!(문제)' : '없음 OK'));
      }
    } finally {
      if (savedHome && w.S) { w.S.home = savedHome; w.showHome(); }
    }
    out.push('· 되돌린 뒤 배너: ' + (d.getElementById('hofBanner') ? '다시 정상 표시 OK' : '사라짐!(문제)'));

    window.__qaExtra = out.join('\n');
    render(window.__qaExtra);
    window.__qa.done = true;
    document.title = 'v105 QA 완료 · 에러 ' + errs.length;
  } catch (e) {
    errs.push('테스트 실패: ' + (e && e.message));
    render(out.join('\n'));
  }
}
</script>
</body>
</html>
