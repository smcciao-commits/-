<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA v95 390×844 임시 검증 페이지</title>
<style>
  html,body{margin:0;background:#0f172a;color:#7CFC98;font:12px/1.45 ui-monospace,monospace}
  #wrap{padding:6px}
  #f{width:390px;height:844px;border:0;display:block;background:#fff;overflow:hidden}
  #bar{margin-top:6px;white-space:pre-wrap;max-width:390px;word-break:break-all}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f" title="390x844 viewport"></iframe>
  <div id="bar">ready</div>
</div>
<script>
var p = new URLSearchParams(location.search);
var w0 = parseInt(p.get('w') || '390', 10), h0 = parseInt(p.get('h') || '844', 10);
var u = p.get('u') || ('index.html?v=95(qa)&t=' + Date.now());
var f = document.getElementById('f');
f.style.width = w0 + 'px'; f.style.height = h0 + 'px';
/* sb=1: 전체화면(requestFullscreen)을 못 쓰는 웹뷰·PWA 상황을 흉내내요 → CSS 90도 회전 경로 */
if (p.get('sb') === '1') f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
window.__errs = [];
window.__info = {};
function draw() {
  var bar = document.getElementById('bar');
  bar.textContent = 'iframe = ' + u + (p.get('sb') === '1' ? '  [sandbox: 전체화면 불가]' : '') +
    '\nviewport = ' + ((window.__info.w || '?') + 'x' + (window.__info.h || '?')) +
    '  errors = ' + window.__errs.length +
    (window.__errs.length ? ('\n' + window.__errs.slice(-8).join('\n')) : '');
}
f.onload = function () {
  try {
    var w = f.contentWindow;
    window.__info.w = w.innerWidth; window.__info.h = w.innerHeight;
    w.addEventListener('error', function (e) {
      window.__errs.push('error: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      draw();
    });
    w.addEventListener('unhandledrejection', function (e) {
      window.__errs.push('reject: ' + ((e.reason && e.reason.message) || e.reason));
      draw();
    });
    var ce = w.console.error;
    w.console.error = function () {
      window.__errs.push('console.error: ' + [].map.call(arguments, function (a) { return String(a); }).join(' '));
      draw();
      try { ce.apply(w.console, arguments); } catch (err) {}
    };
  } catch (e) { window.__errs.push('hook fail: ' + e.message); }
  draw();
};
f.src = u;
draw();
</script>
</body>
</html>
