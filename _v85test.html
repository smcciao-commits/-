<!doctype html><html><head><meta charset="utf-8"><title>v85 test</title>
<style>
body{margin:0;background:#111;font-family:sans-serif;color:#fff}
.wrap{display:flex;gap:10px;padding:10px;align-items:flex-start}
.box{background:#222;border:1px solid #444;padding:4px}
.box h4{margin:2px 0 4px;font:12px sans-serif;color:#9f9}
iframe{border:0;background:#fff;display:block}
</style></head><body>
<div class="wrap">
  <div class="box"><h4>mobile 390x844</h4><iframe id="fm" width="390" height="844" src="_v85preview.html?t=m"></iframe></div>
  <div class="box"><h4>desktop 1280x800</h4><iframe id="fd" width="1280" height="800" src="_v85preview.html?t=d"></iframe></div>
</div>
<script>
window.ERRS=[];
function hook(w,tag){ try{ w.addEventListener('error',function(e){ ERRS.push(tag+': '+(e.message||'')+' @'+(e.filename||'')+':'+(e.lineno||'')); }); w.addEventListener('unhandledrejection',function(e){ ERRS.push(tag+' rej: '+(e.reason&&e.reason.message||e.reason)); }); }catch(e){} }
setTimeout(function(){ hook(document.getElementById('fm').contentWindow,'M'); hook(document.getElementById('fd').contentWindow,'D'); },1500);
</script>
</body></html>
