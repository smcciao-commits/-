<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v99 QA · 390×844</title>
<style>
  html, body { margin: 0; background: #0f172a; font-family: Pretendard, sans-serif; }
  .bar { color: #e2e8f0; font-size: 12px; padding: 6px 10px; font-weight: 700; }
  .bar b { color: #5eead4; }
  iframe { border: 0; display: block; background: #fff; width: 390px; height: 844px; }
</style>
</head>
<body>
<div class="bar" id="bar">v99 숙제 1초 체크 QA · <b>390×844</b> · 에러 <b id="ec">0</b>건</div>
<div style="display:flex">
  <iframe id="fr" src="index.html?qa=99" width="390" height="844" allow="clipboard-write; clipboard-read"></iframe>
  <pre id="log" style="color:#94a3b8;font-size:11px;margin:0;padding:8px;white-space:pre-wrap;max-width:520px"></pre>
</div>
<script>
  var fr = document.getElementById('fr');
  var ec = document.getElementById('ec'), logEl = document.getElementById('log');
  function say(s){ logEl.textContent += s + "\n"; }
  function hook(){
    try {
      var w = fr.contentWindow;
      w.__topeduErrors = [];
      w.addEventListener('error', function(e){ w.__topeduErrors.push(String((e && (e.message || e.error)) || e)); ec.textContent = w.__topeduErrors.length; });
      w.addEventListener('unhandledrejection', function(e){ w.__topeduErrors.push('reject: ' + String(e && e.reason)); ec.textContent = w.__topeduErrors.length; });
      var ce = w.console.error;
      w.console.error = function(){ try { w.__topeduErrors.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); ec.textContent = w.__topeduErrors.length; } catch(_){}; try { ce.apply(w.console, arguments); } catch(_){} };
      say('hook ok · innerWidth=' + w.innerWidth + '×' + w.innerHeight + ' · v=' + (w.TOPEDU_APP_VERSION || '?'));
    } catch(e){ say('hook fail: ' + e); }
  }
  fr.addEventListener('load', hook);
  fr.src = 'index.html?b=' + Date.now();
</script>
</body>
</html>
