<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v92 단어 대결 전수 검증 (중2 · 예비고1)</title>
<style>
  html,body{margin:0;background:#0b1220;color:#cbd5e1;font:12px/1.45 ui-monospace,SFMono-Regular,monospace}
  #top{padding:8px 12px;white-space:pre-wrap;color:#fff;border-bottom:1px solid #1e293b}
  #top b{color:#7CFC98}
  #stage{padding:10px 12px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .dev{display:flex;flex-direction:column;gap:4px}
  .lab{color:#fff;font-weight:700}
  .lab span{color:#64748b;font-weight:400}
  iframe{border:2px solid #334155;background:#fff;display:block}
</style>
</head>
<body>
<div id="top">준비 중…</div>
<div id="stage"></div>
<script>
/* 검증 하네스: 기기별(iframe)로 세션을 따로 세팅해 한 화면에서 교사 1대 + 학생 여러 대를 띄운다.
   ?nobc=1 이므로 같은 기기용 BroadcastChannel은 꺼지고 실시간 허브(MQTT)만으로 통신한다. */
var q = new URLSearchParams(location.search);
var ban = q.get('ban') || '수지중2';
var stus = (q.get('st') || '').split(',').filter(Boolean).map(function (x) {
  var p = x.split(':');
  return { name: p[0], pw: p[1] || '' };
});
var vq = q.get('v') || '92';
var base = 'index.html?nobc=1&v=' + vq;

function dev(label, w, h, id) {
  var d = document.createElement('div');
  d.className = 'dev';
  d.innerHTML = '<div class="lab">' + label + '</div>';
  var f = document.createElement('iframe');
  f.id = id; f.title = id;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  d.appendChild(f);
  document.getElementById('stage').appendChild(d);
  return f;
}
var tf = dev('👩‍🏫 선생님(칠판) · ' + ban + ' <span>1180×900</span>', 1180, 900, 'teacher');
stus.forEach(function (s, i) {
  dev('📱 학생' + (i + 1) + ' · ' + s.name + ' <span>' + ban + ' · 390×844</span>', 390, 844, 's' + (i + 1));
});

function seed(i) {
  try {
    if (i < 0) localStorage.removeItem('cred');
    else localStorage.setItem('cred', JSON.stringify({ ban: ban, name: stus[i].name, pw: stus[i].pw }));
  } catch (e) {}
}
function loadFrame(f, url, then) {
  f.onload = function () { f.onload = null; setTimeout(then, 400); };
  f.src = url + '&t=' + Date.now();
}
/* 교사 화면은 세션 없이 띄운다(로그인 화면 → 선생님 화면으로 직접 들어감) */
function chain(i) {
  if (i >= stus.length) return;
  var f = document.getElementById('s' + (i + 1));
  seed(i);
  f.onload = function () {
    f.onload = null;
    setTimeout(function () { chain(i + 1); }, 500);
  };
  f.src = base + '&stu=' + encodeURIComponent(stus[i].name) + '&t=' + Date.now();
}
seed(-1);
loadFrame(tf, base, function () { chain(0); });

function txt(doc, id) {
  var el = doc && doc.getElementById(id);
  return el ? String(el.textContent || '').trim().replace(/\s+/g, ' ') : '';
}
function frameLine(id, label) {
  try {
    var f = document.getElementById(id), w = f.contentWindow, d = f.contentDocument;
    if (!w || !d || !d.body || !String(d.body.innerHTML || '').trim()) return label + ': (로드 중)';
    var errs = w.__topeduErrors || [];
    var h1 = d.querySelector('h1');
    var head = h1 ? String(h1.textContent || '').trim() : '';
    var net = txt(d, 'bnet') || txt(d, 'stu_net');
    var out = label + ' | ' + (w.TOPEDU_APP_VERSION || '?') + ' | ' + (head || '—');
    if (net) out += ' | ' + net;
    out += ' | 오류 ' + errs.length;
    if (errs.length) out += '\n      ↳ ' + errs.slice(0, 2).join(' / ');
    return out;
  } catch (e) { return label + ': ' + e; }
}
function tick() {
  var lines = ['실서버 ' + location.origin + ' ' + 'v92' + ' · ' + ban + ' · 학생 ' + stus.length + '명 · ' + new Date().toLocaleTimeString('ko-KR'),
               frameLine('teacher', '선생님')];
  stus.forEach(function (s, i) { lines.push(frameLine('s' + (i + 1), '학생' + (i + 1) + ' ' + s.name)); });
  document.getElementById('top').innerHTML = '<b>v92 단어 대결 전수 검증</b> (nobc=1 · 기기별 실시간 허브 MQTT)\n' + lines.join('\n');
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
