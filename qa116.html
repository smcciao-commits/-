<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA v116 · 인강관 가로모드·유튜브 차단</title>
<style>
  html, body { margin: 0; background: #0f172a; font-family: Pretendard, sans-serif; }
  .bar { color: #e2e8f0; font-size: 12px; padding: 6px 10px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar b { color: #5eead4; }
  .bar button { font: inherit; font-size: 11.5px; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
  .bar button.on { background: #0d9488; border-color: #14b8a6; color: #fff; }
  .wrap { background: #1e293b; padding: 6px; display: inline-block; margin: 6px; }
  iframe { border: 0; display: block; background: #fff; width: 390px; height: 844px; }
  #log { color: #94a3b8; font-size: 11px; padding: 4px 10px; max-width: 1800px; white-space: pre-wrap; line-height: 1.4; }
</style>
</head>
<body>
<div class="bar">
  <span>QA v116 인강관 · <b id="sz">390×844</b> · 에러 <b id="ec">0</b>건 · 외부이동시도 <b id="nc">0</b>건</span>
  <button id="bP">세로 390×844</button>
  <button id="bL">가로 844×390</button>
  <button id="bN" class="on">네이티브 전체화면 끔 (CSS 폴백)</button>
  <button id="bR">새로고침</button>
</div>
<div class="wrap"><iframe id="fr" src="index.html?qa=116" width="390" height="844" allow="fullscreen"></iframe></div>
<div id="log"></div>
<script>
var fr = document.getElementById('fr'), ec = document.getElementById('ec'), nc = document.getElementById('nc'), sz = document.getElementById('sz');
var noNative = true, navTries = 0, loaded = 0;
function log(m){ var l = document.getElementById('log'); l.textContent = (new Date().toLocaleTimeString()) + ' · ' + m + '\n' + l.textContent; }
function pushErr(m){ try { fr.contentWindow.__qaErr = (fr.contentWindow.__qaErr || 0) + 1; } catch(e) {} ec.textContent = (+ec.textContent || 0) + 1; log('ERR ' + m); }
function nav(m){ navTries++; nc.textContent = navTries; log('NAV ' + m); }
function harden(){
  try {
    var w = fr.contentWindow;
    if (!w) return;
    w.__qaErr = 0;
    w.addEventListener('error', function(e){ pushErr((e && (e.message || e.error)) || e); });
    w.addEventListener('unhandledrejection', function(e){ pushErr('reject: ' + String(e && e.reason)); });
    if (w.console && w.console.error) { var ce = w.console.error; w.console.error = function(){ pushErr('console: ' + Array.prototype.join.call(arguments, ' ')); return ce.apply(w.console, arguments); }; }
    /* 유튜브로 나가는 시도(새 창/새 탭) 감시 */
    w.open = function(u){ nav('window.open ' + u); return null; };
    /* CSS 폴백 테스트: 네이티브 전체화면 요청을 일부러 실패시켜요 */
    if (noNative) {
      try {
        w.Element.prototype.requestFullscreen = function(){ return Promise.reject(new Error('qa: native fs off')); };
        w.Element.prototype.webkitRequestFullscreen = undefined;
      } catch(e) {}
    }
    log('iframe 준비 · ' + w.innerWidth + '×' + w.innerHeight + ' · 네이티브전체화면 ' + (noNative ? '끔' : '허용'));
  } catch(e) { log('harden 실패 ' + e); }
}
fr.addEventListener('load', function(){ loaded++; setTimeout(harden, 60); });
function setSize(w, h, tx){ fr.width = w; fr.height = h; fr.style.width = w + 'px'; fr.style.height = h + 'px'; sz.textContent = w + '×' + h; log('화면 ' + tx); }
document.getElementById('bP').onclick = function(){ setSize(390, 844, '세로'); };
document.getElementById('bL').onclick = function(){ setSize(844, 390, '가로(폰을 돌린 상태)'); };
document.getElementById('bR').onclick = function(){ fr.src = 'index.html?qa=116&r=' + Date.now(); };
document.getElementById('bN').onclick = function(){ noNative = !noNative; this.classList.toggle('on', noNative); this.textContent = noNative ? '네이티브 전체화면 끔 (CSS 폴백)' : '네이티브 전체화면 허용'; log('네이티브 전체화면 ' + (noNative ? '끔' : '허용')); };
</script>
</body>
</html>
