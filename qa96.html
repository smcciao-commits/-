<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v96 검증 하네스</title>
<style>
  html,body{margin:0;background:#0b1220;color:#cbd5e1;font:12px/1.45 ui-monospace,SFMono-Regular,monospace}
  #bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid #1e293b;background:#111827;align-items:center}
  #bar a,#bar span{color:#e2e8f0}
  #bar a{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:5px 10px;text-decoration:none;font-weight:700}
  #bar a.on{background:#0d9488;border-color:#0d9488;color:#fff}
  #stage{padding:10px}
  iframe{border:2px solid #334155;background:#fff;display:block}
</style>
</head>
<body>
<div id="bar">
  <strong style="color:#5eead4">v96 QA</strong>
  <a id="lnk">불러오는 중…</a>
</div>
<div id="stage"><iframe id="f" width="390" height="844" title="app"></iframe></div>
<script>
/* 검증용 하네스 — 같은 오리진이라 부모에서 cred 를 심고 iframe 으로 앱을 띄운다.
   ?ban=수지중1&name=김수현&pw=3751&url=index.html */
var q = new URLSearchParams(location.search);
var ban = q.get('ban') || '수지중1';
var name = q.get('name') || '김수현';
var pw = q.get('pw') || '3751';
var page = q.get('url') || 'index.html';
var W = parseInt(q.get('w') || '390', 10), H = parseInt(q.get('h') || '844', 10);
try { localStorage.setItem('cred', JSON.stringify({ ban: ban, name: name, pw: pw })); } catch (e) {}
var f = document.getElementById('f');
f.width = W; f.height = H;
f.src = page + '?nobc=1&qa=' + Date.now();
var u = new URL(location.href);
u.searchParams.set('url', page);
document.getElementById('lnk').href = u.toString();
document.getElementById('lnk').textContent = page + ' · ' + ban + ' · ' + name + ' · ' + W + 'x' + H;
</script>
</body>
</html>
