<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탑에듀 v82 mobile 390x844</title>
<style>
  html,body{margin:0;padding:0;background:#1e293b}
  body{display:flex;justify-content:center;align-items:flex-start;padding:10px}
  iframe{width:390px;height:844px;border:0;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<iframe id="f" src="index.html?v=m82" title="mobile view" allow="notifications"></iframe>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var y = parseInt((location.hash||'').replace('#',''),10) || 0;
    var f = document.getElementById('f');
    try { f.contentWindow.scrollTo(0, y); } catch(e){}
  }, 900);
});
</script>
</body>
</html>
